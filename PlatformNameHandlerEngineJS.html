<script>
// Personnel Platform — canonical structured Name Handler Engine
// Uses structured name fields first and falls back to Full Name parsing only when needed.

(function () {
  "use strict";

  const platform = window.PersonnelPlatform;
  if (!platform) return;

  const SUFFIXES = new Set(["JR", "JR.", "SR", "SR.", "II", "III", "IV", "V"]);

  function text(value) {
    return String(value == null ? "" : value).trim();
  }

  function upper(value) {
    return text(value).toUpperCase();
  }

  function field(person, names) {
    const record = person?.record || person || {};
    for (const name of names) {
      const value = person?.[name] ?? record?.[name];
      if (text(value)) return text(value);
    }
    return "";
  }

  function parseFallback(value) {
    const tokens = text(value).replace(/\s+/g, " ").split(" ").filter(Boolean);
    let suffix = "";
    if (tokens.length > 1 && SUFFIXES.has(upper(tokens.at(-1)))) suffix = tokens.pop();
    if (tokens.length < 2) return { firstName: tokens[0] || "", middleName: "", lastName: "", suffix };
    return {
      firstName: tokens[0] || "",
      middleName: tokens.slice(1, -1).join(" "),
      lastName: tokens.at(-1) || "",
      suffix,
    };
  }

  function normalize(person) {
    const rank = field(person, ["rank", "Rank"]);
    let firstName = field(person, ["firstName", "First Name", "FIRST NAME"]);
    let middleName = field(person, ["middleName", "Middle Name", "MIDDLE NAME"]);
    let lastName = field(person, ["lastName", "Last Name", "LAST NAME"]);
    let suffix = field(person, ["suffix", "Suffix", "SUFFIX"]);

    if (!firstName && !lastName) {
      const parsed = parseFallback(field(person, ["fullName", "Full Name", "FULL NAME"]));
      firstName = parsed.firstName;
      middleName = parsed.middleName;
      lastName = parsed.lastName;
      suffix = suffix || parsed.suffix;
    }

    return {
      rank: upper(rank),
      firstName: upper(firstName),
      middleName: upper(middleName),
      lastName: upper(lastName),
      suffix: upper(suffix).replace(/\.$/, ""),
    };
  }

  function middleInitial(value) {
    return text(value)
      .split(/\s+/)
      .filter(Boolean)
      .map(part => part.replace(/\./g, "").charAt(0))
      .filter(Boolean)
      .join(" ")
      .toUpperCase();
  }

  function format(person, options = {}) {
    const parts = normalize(person);
    const includeRank = options.includeRank !== false;
    const order = options.order === "LAST_FIRST" ? "LAST_FIRST" : "FIRST_LAST";
    const middle = options.middleInitial === false ? parts.middleName : middleInitial(parts.middleName);

    let name;
    if (order === "LAST_FIRST") {
      const left = [parts.lastName, parts.suffix].filter(Boolean).join(" ");
      const right = [parts.firstName, middle].filter(Boolean).join(" ");
      name = left && right ? `${left}, ${right}` : left || right;
    } else {
      name = [parts.firstName, middle, parts.lastName, parts.suffix].filter(Boolean).join(" ");
    }

    return [includeRank ? parts.rank : "", name].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
  }

  const engine = {
    version: "1.0.0",
    normalize,
    format,
    formatWithoutRank(person, options = {}) {
      return format(person, { ...options, includeRank: false });
    },
    formatForReport(person, options = {}) {
      return format(person, { ...options, includeRank: true, middleInitial: true });
    },
    status() {
      const report = { version: this.version, structuredFirst: true, fallbackParsing: true };
      console.table(report);
      return report;
    },
  };

  if (platform.engines.has("nameHandler")) platform.engines.replace("nameHandler", engine);
  else platform.engines.register("nameHandler", engine);

  window.$PF = window.$PF || {};
  window.$PF.name = engine;
  console.info("NameHandlerEngine v1.0.0 active.");
})();
</script>
