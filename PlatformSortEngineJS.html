<script>
// Personnel Platform — reusable SortEngine
// Developer Mode foundation. Pure sorting service with no DOM dependencies.

(function () {
  "use strict";

  const platform = window.PersonnelPlatform;
  if (!platform) return;

  const RANK_WEIGHTS = Object.freeze({
    CCSUPT: 1,
    CTCSUPT: 1.1,
    CSSUPT: 2,
    CTSSUPT: 2.1,
    CSUPT: 3,
    CTSUPT: 3.1,
    CCINSP: 4,
    CTCINSP: 4.1,
    CSINSP: 5,
    CTSINSP: 5.1,
    CINSP: 6,
    CTINSP: 6.1,
    CSO4: 7,
    CTSO4: 7.1,
    CSO3: 8,
    CTSO3: 8.1,
    CSO2: 9,
    CTSO2: 9.1,
    CSO1: 10,
    CTSO1: 10.1,
    CO3: 11,
    CTO3: 11.1,
    CO2: 12,
    CTO2: 12.1,
    CO1: 13,
    CTO1: 13.1,
  });

  function text(value) {
    return String(value == null ? "" : value).trim();
  }

  function normalizeRank(value) {
    return text(value).toUpperCase().replace(/\s+/g, "");
  }

  function rankWeight(value) {
    return RANK_WEIGHTS[normalizeRank(value)] ?? 999;
  }

  function lastName(value) {
    const name = text(value).replace(/\s+(JR\.?|SR\.?|II|III|IV)$/i, "").trim();
    const parts = name.split(/\s+/).filter(Boolean);
    return parts.at(-1) || "";
  }

  function compareText(a, b) {
    return text(a).localeCompare(text(b), undefined, {
      numeric: true,
      sensitivity: "base",
    });
  }

  function compareRank(a, b) {
    return rankWeight(a) - rankWeight(b) || compareText(a, b);
  }

  const SortEngine = {
    version: "1.1.0",
    modes: ["LIST", "RANK", "RANK_LAST_NAME", "LAST_NAME", "ASSIGNED_SEQUENCE"],
    rankWeights: RANK_WEIGHTS,
    rankWeight,

    sort(items, options = {}) {
      const mode = this.modes.includes(options.mode) ? options.mode : "LIST";
      const list = [...(items || [])];
      const getKey = options.getKey || (item => item?.key ?? item);
      const getRank = options.getRank || (() => "");
      const getName = options.getName || (() => "");
      const listOrder = options.listOrder instanceof Map ? options.listOrder : new Map();
      const assignedOrder = options.assignedOrder instanceof Map ? options.assignedOrder : new Map();

      return list.sort((a, b) => {
        const keyA = getKey(a);
        const keyB = getKey(b);
        const rankA = getRank(a);
        const rankB = getRank(b);
        const nameA = getName(a);
        const nameB = getName(b);

        if (mode === "RANK") {
          return compareRank(rankA, rankB) || compareText(nameA, nameB);
        }

        if (mode === "RANK_LAST_NAME") {
          return compareRank(rankA, rankB) ||
            compareText(lastName(nameA), lastName(nameB)) ||
            compareText(nameA, nameB);
        }

        if (mode === "LAST_NAME") {
          return compareText(lastName(nameA), lastName(nameB)) || compareText(nameA, nameB);
        }

        if (mode === "ASSIGNED_SEQUENCE") {
          return (assignedOrder.get(keyA) ?? Number.MAX_SAFE_INTEGER) -
            (assignedOrder.get(keyB) ?? Number.MAX_SAFE_INTEGER);
        }

        return (listOrder.get(keyA) ?? Number.MAX_SAFE_INTEGER) -
          (listOrder.get(keyB) ?? Number.MAX_SAFE_INTEGER);
      });
    },
  };

  if (platform.engines.has("sort")) platform.engines.replace("sort", SortEngine);
  else platform.engines.register("sort", SortEngine);

  window.$PF.sort = SortEngine;
  console.info("Reusable SortEngine v1.1.0 active with official rank hierarchy.");
})();
</script>
