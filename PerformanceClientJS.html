<script>
//----------------------------------
// Personnel Performance Client
//----------------------------------

const PERSONNEL_SEARCH_DEBOUNCE_MS = 250;

window.addEventListener("DOMContentLoaded", () => {
  PERSONNEL_APP_CONFIG.previewRowLimit = 100;
  PersonnelState.autoApply = false;

  const autoApplyToggle = document.getElementById("autoApplyToggle");
  if (autoApplyToggle) autoApplyToggle.checked = false;

  installDebouncedPersonnelSearch_();
  patchPersonnelFiltering_();
  patchPersonnelAnalytics_();
  patchAoRowButtonsForFastUpdates_();

  setSyncStatus("Preview only", "ready");
  setLastSyncLabel("Auto Apply is off. Click Apply Now only when you want to sync the Sheet view.");
});

function installDebouncedPersonnelSearch_() {
  const original = document.getElementById("searchInput");
  if (!original || original.dataset.performancePatched === "true") return;

  const replacement = original.cloneNode(true);
  replacement.dataset.performancePatched = "true";
  original.replaceWith(replacement);

  let timer = null;
  replacement.addEventListener("input", event => {
    clearTimeout(timer);
    const value = event.target.value;

    timer = window.setTimeout(() => {
      PersonnelState.filters.search = value;
      handleFilterChange();
    }, PERSONNEL_SEARCH_DEBOUNCE_MS);
  });
}

function patchPersonnelFiltering_() {
  filterPersonnelRecords = function () {
    const searchTerm = String(PersonnelState.filters.search || "")
      .trim()
      .toLowerCase();
    const groups = PERSONNEL_APP_CONFIG.filterGroups;
    const selectedRanks = PersonnelState.filters.ranks;

    return PersonnelState.records.filter(record => {
      for (const group of groups) {
        const selected = PersonnelState.filters[group.key];
        if (selected.size && !selected.has(String(record[group.recordKey] || "").trim())) {
          return false;
        }
      }

      if (selectedRanks.size && !selectedRanks.has(String(record.Rank || "").trim())) {
        return false;
      }

      if (!searchTerm) return true;

      if (!record.__personnelSearchText) {
        record.__personnelSearchText = PERSONNEL_APP_CONFIG.searchableColumns
          .map(column => String(record[column] || "").trim().toLowerCase())
          .join("\u0001");
      }

      return record.__personnelSearchText.includes(searchTerm);
    });
  };

  const originalFilterAndRender = filterAndRenderPersonnel;
  let scheduled = false;

  filterAndRenderPersonnel = function () {
    if (scheduled) return;
    scheduled = true;

    window.requestAnimationFrame(() => {
      scheduled = false;
      originalFilterAndRender();
    });
  };
}

function patchPersonnelAnalytics_() {
  analyzePersonnelDuplicates = function (records) {
    const nameGroups = new Map();
    const fields = ["Gender", "Category", "Camp", "Office", "Rank"];
    const summaryMaps = new Map(fields.map(field => [field, new Map()]));

    records.forEach(record => {
      const displayName = String(record["Full Name"] || "").trim();
      const normalizedName = normalizePersonnelName_(displayName);

      if (normalizedName) {
        if (!nameGroups.has(normalizedName)) {
          nameGroups.set(normalizedName, {
            normalizedName,
            displayName,
            records: [],
          });
        }
        nameGroups.get(normalizedName).records.push(record);
      }

      fields.forEach(field => {
        const value = String(record[field] || "").trim();
        if (!value) return;
        const counts = summaryMaps.get(field);
        counts.set(value, (counts.get(value) || 0) + 1);
      });
    });

    const duplicateGroups = [...nameGroups.values()]
      .filter(group => group.records.length > 1)
      .sort((a, b) =>
        b.records.length - a.records.length ||
        a.displayName.localeCompare(b.displayName, undefined, {
          sensitivity: "base",
        })
      );

    const duplicateExtraRows = duplicateGroups.reduce(
      (total, group) => total + group.records.length - 1,
      0
    );
    const duplicateTotalRows = duplicateGroups.reduce(
      (total, group) => total + group.records.length,
      0
    );

    PersonnelState.__performanceAnalytics = {
      records,
      summaryMaps,
    };

    return {
      uniqueCount: nameGroups.size,
      duplicateNameCount: duplicateGroups.length,
      duplicateExtraRows,
      duplicateTotalRows,
      duplicateGroups,
    };
  };

  renderCountingReports_ = function (records) {
    const fields = [
      ["Gender", "genderReport"],
      ["Category", "categoryReport"],
      ["Camp", "campReport"],
      ["Office", "officeReport"],
      ["Rank", "rankReport"],
    ];

    const analytics = PersonnelState.__performanceAnalytics;
    const maps = analytics && analytics.records === records
      ? analytics.summaryMaps
      : new Map(fields.map(([field]) => [field, new Map()]));

    fields.forEach(([field, containerId]) => {
      const items = [...(maps.get(field) || new Map()).entries()]
        .map(([label, count]) => ({ label, count }))
        .sort((a, b) =>
          b.count - a.count ||
          a.label.localeCompare(b.label, undefined, {
            numeric: true,
            sensitivity: "base",
          })
        );
      renderReportList_(containerId, items);
    });

    renderTypeBreakdown_(records);
  };
}

function patchAoRowButtonsForFastUpdates_() {
  if (typeof createAoAddButton_ !== "function") return;

  createAoAddButton_ = function (record) {
    const key = getAoPersonnelKey_(record);
    const button = document.createElement("button");

    button.type = "button";
    button.className = "ao-row-add-button";

    const refreshButton = () => {
      const isAdded = PersonnelState.aoCart.has(key);
      button.classList.toggle("is-added", isAdded);
      button.textContent = isAdded ? "✓ Added" : "+ Add";
      button.title = isAdded
        ? "Remove from AO selection"
        : "Add to AO selection";
    };

    refreshButton();

    button.addEventListener("click", () => {
      togglePersonnelInAoCart_(record);
      refreshButton();
    });

    return button;
  };
}
</script>
