<script>
(function () {
  "use strict";

  const STATUS_BY_CELL = {
    1: "PRESENT",
    2: "ABSENT",
    3: "LEAVE",
    4: "OB",
    5: "OFF",
    6: "UNRECORDED",
    7: "TOTAL"
  };

  const CELL_BY_STATUS = Object.fromEntries(
    Object.entries(STATUS_BY_CELL).map(([index, status]) => [status, Number(index)])
  );

  let locked = null;
  let hoverToken = 0;

  function installStyles() {
    if (document.getElementById("attendanceReportTraceStyles")) return;
    const style = document.createElement("style");
    style.id = "attendanceReportTraceStyles";
    style.textContent = `
      #attendanceReportBackdrop .arr-summary-row td:not(:first-child){position:relative;cursor:crosshair;transition:background-color .12s ease,box-shadow .12s ease,transform .12s ease}
      #attendanceReportBackdrop .arr-summary-row td.arr-trace-cell{background:#cfead6!important;box-shadow:inset 0 0 0 2px #347f49;font-weight:900;color:#173d23;transform:translateY(-1px)}
      #attendanceReportBackdrop .arr-summary-row td.arr-trace-locked{background:#bfe2c8!important;box-shadow:inset 0 0 0 3px #245f36;font-weight:900;color:#123c20}
      #attendanceReportBackdrop .arr-summary-row td.arr-trace-locked::after{content:"✓";position:absolute;right:3px;top:1px;font-size:8px;color:#245f36}
      #attendanceReportBackdrop #arrDetail tbody tr{transition:opacity .12s ease,background-color .12s ease,box-shadow .12s ease}
      #attendanceReportBackdrop #arrDetail tbody tr.arr-trace-match td{background:#e3f4e7!important}
      #attendanceReportBackdrop #arrDetail tbody tr.arr-trace-match td:first-child{box-shadow:inset 5px 0 0 #347f49}
      #attendanceReportBackdrop #arrDetail tbody tr.arr-trace-dim{opacity:.22}
      #attendanceReportBackdrop #arrDetail tbody tr.arr-trace-revealed td{animation:arrTraceReveal .75s ease}
      #attendanceReportBackdrop #arrDetailTitle.arr-trace-title::after{content:attr(data-trace-label);display:inline-flex;margin-left:8px;padding:3px 7px;border-radius:999px;background:#dff1e4;color:#245f36;font-size:9px;font-weight:900;vertical-align:middle}
      #attendanceReportBackdrop .arr-trace-audit{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 9px;border-top:1px solid #d8e5db;background:#f5faf6}
      #attendanceReportBackdrop .arr-trace-audit[hidden]{display:none}
      #attendanceReportBackdrop .arr-trace-stat{border:1px solid #dbe8de;border-radius:8px;background:#fff;padding:6px 8px}
      #attendanceReportBackdrop .arr-trace-stat span{display:block;font-size:8px;font-weight:900;letter-spacing:.04em;color:#6c7e71;text-transform:uppercase}
      #attendanceReportBackdrop .arr-trace-stat strong{display:block;margin-top:2px;font-size:14px;color:#203d29}
      #attendanceReportBackdrop .arr-trace-stat.is-active{background:#e3f4e7;border-color:#b8d9c0}
      #attendanceReportBackdrop .arr-trace-help{grid-column:1/-1;font-size:9px;color:#6b7d70;text-align:center;padding-top:1px}
      @keyframes arrTraceReveal{0%{box-shadow:inset 0 0 0 3px #2f7d45,0 0 0 0 rgba(47,125,69,.35)}55%{box-shadow:inset 0 0 0 3px #2f7d45,0 0 0 7px rgba(47,125,69,.12)}100%{box-shadow:inset 0 0 0 0 transparent,0 0 0 0 transparent}}
    `;
    document.head.appendChild(style);
  }

  function reportOpen() {
    const backdrop = document.getElementById("attendanceReportBackdrop");
    return Boolean(backdrop && !backdrop.hidden);
  }

  function ensureAuditStrip() {
    const totals = document.getElementById("arrDetailTotals");
    if (!totals || document.getElementById("arrTraceAudit")) return;
    const strip = document.createElement("div");
    strip.id = "arrTraceAudit";
    strip.className = "arr-trace-audit";
    strip.hidden = true;
    totals.insertAdjacentElement("beforebegin", strip);
  }

  function updateAuditStrip(status, matched, total, isLocked) {
    ensureAuditStrip();
    const strip = document.getElementById("arrTraceAudit");
    if (!strip) return;
    const hidden = Math.max(0, total - matched);
    strip.hidden = false;
    strip.innerHTML = `
      <div class="arr-trace-stat is-active"><span>Inspecting</span><strong>${status === "TOTAL" ? "ALL" : status}</strong></div>
      <div class="arr-trace-stat"><span>Visible</span><strong>${matched}</strong></div>
      <div class="arr-trace-stat"><span>Hidden</span><strong>${hidden}</strong></div>
      <div class="arr-trace-help">${isLocked ? "Locked · use ← → to inspect another status · Esc to clear" : "Hover preview · click the number to lock"}</div>`;
  }

  function clearVisuals() {
    document.querySelectorAll("#attendanceReportBackdrop .arr-trace-cell, #attendanceReportBackdrop .arr-trace-locked")
      .forEach(cell => cell.classList.remove("arr-trace-cell", "arr-trace-locked"));
    document.querySelectorAll("#attendanceReportBackdrop #arrDetail tbody tr")
      .forEach(row => row.classList.remove("arr-trace-match", "arr-trace-dim", "arr-trace-revealed"));
    const title = document.getElementById("arrDetailTitle");
    if (title) {
      title.classList.remove("arr-trace-title");
      title.removeAttribute("data-trace-label");
    }
    const strip = document.getElementById("arrTraceAudit");
    if (strip) {
      strip.hidden = true;
      strip.innerHTML = "";
    }
  }

  function rowStatus(row) {
    const badge = row.querySelector(".arr-status");
    return String(badge && badge.textContent || "").trim().toUpperCase();
  }

  function isOutsideScrollView(row, scrollWrap) {
    if (!row || !scrollWrap) return false;
    const rowBox = row.getBoundingClientRect();
    const wrapBox = scrollWrap.getBoundingClientRect();
    return rowBox.top < wrapBox.top || rowBox.bottom > wrapBox.bottom;
  }

  function revealFirstMatch(rows) {
    const firstMatch = rows.find(row => row.classList.contains("arr-trace-match"));
    const scrollWrap = document.getElementById("arrDetail");
    if (!firstMatch || !scrollWrap || !isOutsideScrollView(firstMatch, scrollWrap)) return;

    firstMatch.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
    firstMatch.classList.remove("arr-trace-revealed");
    void firstMatch.offsetWidth;
    firstMatch.classList.add("arr-trace-revealed");
  }

  function applyTrace(cell, status, isLocked) {
    if (!cell || !status) return;
    clearVisuals();
    cell.classList.add(isLocked ? "arr-trace-locked" : "arr-trace-cell");

    const detailRows = Array.from(document.querySelectorAll("#attendanceReportBackdrop #arrDetail tbody tr"));
    detailRows.forEach(row => {
      const match = status === "TOTAL" || rowStatus(row) === status;
      row.classList.toggle("arr-trace-match", match);
      row.classList.toggle("arr-trace-dim", !match);
    });

    const matched = detailRows.filter(row => row.classList.contains("arr-trace-match")).length;
    const title = document.getElementById("arrDetailTitle");
    if (title) {
      title.classList.add("arr-trace-title");
      title.setAttribute(
        "data-trace-label",
        status === "TOTAL" ? matched + " personnel" : status + " · " + matched + " of " + detailRows.length
      );
    }

    updateAuditStrip(status, matched, detailRows.length, isLocked);

    if (matched && status !== "TOTAL") {
      window.requestAnimationFrame(() => revealFirstMatch(detailRows));
    }
  }

  function ensureOfficeSelected(summaryRow, callback) {
    if (!summaryRow) return;
    const isActive = summaryRow.classList.contains("is-active");
    if (isActive) {
      callback();
      return;
    }
    summaryRow.click();
    window.requestAnimationFrame(() => window.requestAnimationFrame(callback));
  }

  function traceFromCell(cell, isLocked) {
    const row = cell && cell.closest(".arr-summary-row");
    if (!row) return;
    const status = STATUS_BY_CELL[cell.cellIndex];
    if (!status) return;
    const token = ++hoverToken;
    ensureOfficeSelected(row, function () {
      if (token !== hoverToken && !isLocked) return;
      applyTrace(cell, status, isLocked);
    });
  }

  function lockedCell() {
    if (!locked) return null;
    const rows = Array.from(document.querySelectorAll("#arrSummary .arr-summary-row"));
    const row = rows.find(item => String(item.dataset.office || "") === locked.office);
    const index = CELL_BY_STATUS[locked.status];
    return row && index ? row.cells[index] : null;
  }

  function moveLocked(direction) {
    if (!locked) return;
    const currentIndex = CELL_BY_STATUS[locked.status] || 1;
    const nextIndex = Math.min(7, Math.max(1, currentIndex + direction));
    if (nextIndex === currentIndex) return;
    const currentCell = lockedCell();
    const row = currentCell && currentCell.closest(".arr-summary-row");
    const nextCell = row && row.cells[nextIndex];
    if (!nextCell) return;
    locked.status = STATUS_BY_CELL[nextIndex];
    traceFromCell(nextCell, true);
    nextCell.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }

  document.addEventListener("pointerover", function (event) {
    if (!reportOpen() || locked) return;
    const cell = event.target.closest && event.target.closest("#arrSummary .arr-summary-row td");
    if (!cell || cell.cellIndex === 0) return;
    traceFromCell(cell, false);
  });

  document.addEventListener("pointerout", function (event) {
    if (!reportOpen() || locked) return;
    const cell = event.target.closest && event.target.closest("#arrSummary .arr-summary-row td");
    if (!cell) return;
    const next = event.relatedTarget;
    if (next && cell.contains(next)) return;
    ++hoverToken;
    clearVisuals();
  });

  document.addEventListener("click", function (event) {
    if (!reportOpen()) return;
    const cell = event.target.closest && event.target.closest("#arrSummary .arr-summary-row td");
    if (!cell || cell.cellIndex === 0) return;

    event.preventDefault();
    event.stopPropagation();

    const office = String(cell.closest(".arr-summary-row")?.dataset.office || "");
    const status = STATUS_BY_CELL[cell.cellIndex];
    const same = locked && locked.office === office && locked.status === status;

    if (same) {
      locked = null;
      clearVisuals();
      return;
    }

    locked = { office, status };
    traceFromCell(cell, true);
  }, true);

  document.addEventListener("click", function (event) {
    if (!locked || !reportOpen()) return;
    if (event.target.closest && event.target.closest("#arrSummary .arr-summary-row td")) return;
    locked = null;
    clearVisuals();
  });

  document.addEventListener("keydown", function (event) {
    if (!reportOpen()) return;
    if (event.key === "Escape" && locked) {
      locked = null;
      clearVisuals();
      return;
    }
    if (!locked || (event.key !== "ArrowLeft" && event.key !== "ArrowRight")) return;
    event.preventDefault();
    moveLocked(event.key === "ArrowRight" ? 1 : -1);
  });

  document.addEventListener("DOMContentLoaded", function () {
    installStyles();
    ensureAuditStrip();
  });
  installStyles();
})();
</script>
