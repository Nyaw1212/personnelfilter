<script>
(function () {
  "use strict";

  const STORAGE_KEY = "aoBucketsV1";
  const state = {
    buckets: [],
    activeBucketId: "",
  };

  document.addEventListener("DOMContentLoaded", initAoBuckets);

  function initAoBuckets() {
    loadState();
    injectStyles();
    buildUi();
    watchPreview();
    refreshUi();
  }

  function buildUi() {
    const app = document.getElementById("app") || document.body;

    const toolbar = document.createElement("div");
    toolbar.id = "aoBucketToolbar";
    toolbar.className = "ao-bucket-toolbar";
    toolbar.innerHTML = `
      <button id="createAoBucketButton" class="ao-btn ao-primary" type="button">+ Create AO Bucket</button>
      <button id="addAllVisibleButton" class="ao-btn" type="button">+ Add All Visible</button>
      <button id="openAoBucketsButton" class="ao-btn" type="button">
        AO Buckets <span id="aoBucketCount" class="ao-badge">0</span>
      </button>
    `;

    const previewHeader = document.getElementById("previewTableHeader");
    const previewSection = previewHeader?.closest("section") || previewHeader?.parentElement;

    if (previewSection?.parentNode) {
      previewSection.parentNode.insertBefore(toolbar, previewSection);
    } else {
      app.prepend(toolbar);
    }

    const backdrop = document.createElement("div");
    backdrop.id = "aoBucketBackdrop";
    backdrop.className = "ao-backdrop";
    backdrop.hidden = true;

    const drawer = document.createElement("aside");
    drawer.id = "aoBucketDrawer";
    drawer.className = "ao-drawer";
    drawer.hidden = true;
    drawer.innerHTML = `
      <div class="ao-drawer-header">
        <div>
          <small>Administrative Order</small>
          <h2>AO Buckets</h2>
        </div>
        <button id="closeAoBucketsButton" class="ao-icon-btn" type="button">×</button>
      </div>

      <div id="aoBucketMessage" class="ao-message"></div>

      <div class="ao-create-grid">
        <input id="aoBucketNameInput" type="text" placeholder="Bucket name">
        <input id="aoBucketDestinationInput" type="text" placeholder="Destination office">
        <button id="saveAoBucketButton" class="ao-btn ao-primary" type="button">Create Bucket</button>
      </div>

      <div id="aoBucketList" class="ao-bucket-list"></div>
    `;

    document.body.append(backdrop, drawer);

    document.getElementById("createAoBucketButton").addEventListener("click", () => {
      openDrawer();
      document.getElementById("aoBucketNameInput").focus();
    });

    document.getElementById("openAoBucketsButton").addEventListener("click", openDrawer);
    document.getElementById("closeAoBucketsButton").addEventListener("click", closeDrawer);
    document.getElementById("aoBucketBackdrop").addEventListener("click", closeDrawer);
    document.getElementById("saveAoBucketButton").addEventListener("click", createBucket);
    document.getElementById("addAllVisibleButton").addEventListener("click", addAllVisible);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDrawer();
    });
  }

  function createBucket() {
    const nameInput = document.getElementById("aoBucketNameInput");
    const destinationInput = document.getElementById("aoBucketDestinationInput");

    const name = String(nameInput.value || "").trim();
    const destinationOffice = String(destinationInput.value || "").trim();

    if (!name || !destinationOffice) {
      showMessage("Enter both the bucket name and destination office.", "error");
      return;
    }

    const bucket = {
      id: `bucket_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      name,
      destinationOffice,
      personnel: [],
    };

    state.buckets.push(bucket);
    state.activeBucketId = bucket.id;

    nameInput.value = "";
    destinationInput.value = "";

    saveState();
    refreshUi();
    showMessage(`Created "${bucket.name}".`, "success");
  }

  function addAllVisible() {
    const bucket = getActiveBucket();

    if (!bucket) {
      openDrawer();
      showMessage("Create or select an AO bucket first.", "error");
      return;
    }

    const records = getVisibleRecords();
    let added = 0;

    records.forEach(record => {
      if (addRecord(bucket, record)) added++;
    });

    saveState();
    refreshUi();
    decorateRows();
    openDrawer();

    showMessage(
      added
        ? `${added} visible personnel added to "${bucket.name}".`
        : "All visible personnel are already in this bucket.",
      added ? "success" : ""
    );
  }

  function addRecord(bucket, record) {
    const item = normalizeRecord(record, bucket.destinationOffice);

    if (bucket.personnel.some(person => person.key === item.key)) {
      return false;
    }

    bucket.personnel.push(item);
    return true;
  }

  function normalizeRecord(record, destinationOffice) {
    const rank = pick(record, ["Rank", "RANK", "rank"]);
    const fullName = pick(record, ["Full Name", "FULL NAME", "fullName", "name"]);
    const from = pick(record, ["Office", "OFFICE", "office"]);
    const sourceRow = pick(record, ["__sheetRow", "sheetRow", "rowIndex", "id"]);

    return {
      key: sourceRow
        ? `row:${sourceRow}`
        : [rank, fullName, from].map(normalize).join("|"),
      sourceRow,
      rank,
      fullName,
      from,
      to: destinationOffice,
      notes: "",
    };
  }

  function pick(record, keys) {
    for (const key of keys) {
      const value = record?.[key];
      if (value !== null && value !== undefined && String(value).trim()) {
        return String(value).trim();
      }
    }
    return "";
  }

  function normalize(value) {
    return String(value || "").trim().toLowerCase();
  }

  function getVisibleRecords() {
    return Array.isArray(window.PersonnelState?.filteredRecords)
      ? window.PersonnelState.filteredRecords
      : [];
  }

  function getActiveBucket() {
    return state.buckets.find(bucket => bucket.id === state.activeBucketId) || null;
  }

  function setActiveBucket(bucketId) {
    state.activeBucketId = bucketId;
    saveState();
    refreshUi();
    decorateRows();
  }

  function removePerson(bucketId, personKey) {
    const bucket = state.buckets.find(item => item.id === bucketId);
    if (!bucket) return;

    bucket.personnel = bucket.personnel.filter(person => person.key !== personKey);
    saveState();
    refreshUi();
    decorateRows();
  }

  function clearBucket(bucketId) {
    const bucket = state.buckets.find(item => item.id === bucketId);
    if (!bucket || !confirm(`Clear "${bucket.name}"?`)) return;

    bucket.personnel = [];
    saveState();
    refreshUi();
    decorateRows();
  }

  function deleteBucket(bucketId) {
    const bucket = state.buckets.find(item => item.id === bucketId);
    if (!bucket || !confirm(`Delete "${bucket.name}"?`)) return;

    state.buckets = state.buckets.filter(item => item.id !== bucketId);

    if (state.activeBucketId === bucketId) {
      state.activeBucketId = state.buckets[0]?.id || "";
    }

    saveState();
    refreshUi();
    decorateRows();
  }

  function updateDestination(bucketId, destinationOffice) {
    const bucket = state.buckets.find(item => item.id === bucketId);
    if (!bucket) return;

    bucket.destinationOffice = String(destinationOffice || "").trim();

    bucket.personnel.forEach(person => {
      person.to = bucket.destinationOffice;
    });

    saveState();
    refreshUi();
  }

  function sendBucket(bucketId) {
    const bucket = state.buckets.find(item => item.id === bucketId);

    if (!bucket) {
      showMessage("Bucket not found.", "error");
      return;
    }

    if (!bucket.destinationOffice) {
      showMessage("Destination office is required.", "error");
      return;
    }

    if (!bucket.personnel.length) {
      showMessage("This bucket is empty.", "error");
      return;
    }

    showMessage(`Sending ${bucket.personnel.length} personnel to AOGENup...`, "working");

    google.script.run
      .withSuccessHandler(result => {
        showMessage(
          result?.success
            ? `${result.receivedCount || bucket.personnel.length} personnel sent successfully.`
            : result?.message || "AOGENup rejected the bucket.",
          result?.success ? "success" : "error"
        );
      })
      .withFailureHandler(error => {
        showMessage(error?.message || String(error), "error");
      })
      .sendAoBucketToAogen({
        id: bucket.id,
        name: bucket.name,
        destinationOffice: bucket.destinationOffice,
        personnel: bucket.personnel,
      });
  }

  function watchPreview() {
    const body = document.getElementById("previewTableBody");

    if (!body) {
      setTimeout(watchPreview, 300);
      return;
    }

    new MutationObserver(decorateRows).observe(body, {
      childList: true,
      subtree: false,
    });

    decorateRows();
  }

  function decorateRows() {
    const body = document.getElementById("previewTableBody");
    const header = document.getElementById("previewTableHeader");

    if (!body || !header) return;

    if (!header.querySelector(".ao-action-header")) {
      const th = document.createElement("th");
      th.className = "ao-action-header";
      th.textContent = "AO Bucket";
      header.appendChild(th);
    }

    const records = getVisibleRecords();
    const activeBucket = getActiveBucket();

    [...body.querySelectorAll("tr")].forEach((row, index) => {
      let cell = row.querySelector(".ao-action-cell");

      if (!cell) {
        cell = document.createElement("td");
        cell.className = "ao-action-cell";
        row.appendChild(cell);
      }

      const record = records[index];

      if (!record) {
        cell.textContent = "";
        return;
      }

      const item = normalizeRecord(record, activeBucket?.destinationOffice || "");
      const added = Boolean(
        activeBucket?.personnel.some(person => person.key === item.key)
      );

      const button = document.createElement("button");
      button.type = "button";
      button.className = `ao-row-btn${added ? " is-added" : ""}`;
      button.textContent = added ? "✓ Added" : "+ Add";
      button.disabled = added;

      button.addEventListener("click", () => {
        const bucket = getActiveBucket();

        if (!bucket) {
          openDrawer();
          showMessage("Create or select an AO bucket first.", "error");
          return;
        }

        addRecord(bucket, record);
        saveState();
        refreshUi();
        decorateRows();
      });

      cell.innerHTML = "";
      cell.appendChild(button);
    });
  }

  function refreshUi() {
    renderBucketList();
    updateBadge();
  }

  function renderBucketList() {
    const list = document.getElementById("aoBucketList");
    if (!list) return;

    list.innerHTML = "";

    if (!state.buckets.length) {
      list.innerHTML = '<div class="ao-empty">No AO buckets yet.</div>';
      return;
    }

    state.buckets.forEach(bucket => {
      const card = document.createElement("article");
      card.className = `ao-card${bucket.id === state.activeBucketId ? " is-active" : ""}`;

      const people = bucket.personnel.map((person, index) => `
        <div class="ao-person">
          <div>
            <strong>${index + 1}. ${escapeHtml([person.rank, person.fullName].filter(Boolean).join(" "))}</strong>
            <small>${escapeHtml(person.from)} → ${escapeHtml(bucket.destinationOffice)}</small>
          </div>
          <button class="ao-icon-btn" type="button" data-remove-person="${escapeHtml(person.key)}">×</button>
        </div>
      `).join("");

      card.innerHTML = `
        <div class="ao-card-header">
          <div>
            <strong>${escapeHtml(bucket.name)}</strong>
            <small>${bucket.personnel.length} personnel</small>
          </div>
          <button class="ao-btn" type="button" data-active-bucket="${bucket.id}">
            ${bucket.id === state.activeBucketId ? "Active Bucket" : "Set Active"}
          </button>
        </div>

        <label class="ao-field">
          <span>Destination office</span>
          <input type="text" value="${escapeHtml(bucket.destinationOffice)}" data-destination="${bucket.id}">
        </label>

        <div class="ao-person-list">
          ${people || '<div class="ao-empty-small">No personnel added.</div>'}
        </div>

        <div class="ao-card-actions">
          <button class="ao-btn" type="button" data-clear-bucket="${bucket.id}">Clear</button>
          <button class="ao-btn ao-danger" type="button" data-delete-bucket="${bucket.id}">Delete</button>
          <button class="ao-btn ao-primary" type="button" data-send-bucket="${bucket.id}">Send to AOGENup</button>
        </div>
      `;

      card.querySelector("[data-active-bucket]").addEventListener("click", () => {
        setActiveBucket(bucket.id);
      });

      card.querySelector("[data-destination]").addEventListener("change", event => {
        updateDestination(bucket.id, event.target.value);
      });

      card.querySelector("[data-clear-bucket]").addEventListener("click", () => {
        clearBucket(bucket.id);
      });

      card.querySelector("[data-delete-bucket]").addEventListener("click", () => {
        deleteBucket(bucket.id);
      });

      card.querySelector("[data-send-bucket]").addEventListener("click", () => {
        sendBucket(bucket.id);
      });

      card.querySelectorAll("[data-remove-person]").forEach(button => {
        button.addEventListener("click", () => {
          removePerson(bucket.id, button.dataset.removePerson);
        });
      });

      list.appendChild(card);
    });
  }

  function updateBadge() {
    const total = state.buckets.reduce(
      (sum, bucket) => sum + bucket.personnel.length,
      0
    );

    const badge = document.getElementById("aoBucketCount");
    if (badge) badge.textContent = total;

    const addAllButton = document.getElementById("addAllVisibleButton");
    const activeBucket = getActiveBucket();

    if (addAllButton) {
      addAllButton.textContent = activeBucket
        ? `+ Add All Visible to ${activeBucket.name}`
        : "+ Add All Visible";
    }
  }

  function openDrawer() {
    document.getElementById("aoBucketDrawer").hidden = false;
    document.getElementById("aoBucketBackdrop").hidden = false;
    refreshUi();
  }

  function closeDrawer() {
    document.getElementById("aoBucketDrawer").hidden = true;
    document.getElementById("aoBucketBackdrop").hidden = true;
  }

  function showMessage(message, type) {
    const element = document.getElementById("aoBucketMessage");
    element.textContent = message || "";
    element.className = `ao-message${type ? ` is-${type}` : ""}`;
  }

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

      if (saved && Array.isArray(saved.buckets)) {
        state.buckets = saved.buckets;
        state.activeBucketId = saved.activeBucketId || "";
      }
    } catch (error) {
      console.warn("AO bucket storage error:", error);
    }
  }

  function saveState() {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        buckets: state.buckets,
        activeBucketId: state.activeBucketId,
      })
    );
  }

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function injectStyles() {
    const style = document.createElement("style");
    style.textContent = `
      .ao-bucket-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.07);backdrop-filter:blur(14px)}
      .ao-btn,.ao-row-btn{min-height:38px;padding:8px 13px;border:1px solid rgba(255,255,255,.18);border-radius:12px;color:inherit;background:rgba(255,255,255,.08);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
      .ao-btn:disabled,.ao-row-btn:disabled{opacity:.58;cursor:default}
      .ao-primary{color:#061906;border-color:#fff200;background:linear-gradient(135deg,#fff200,#fff88b)}
      .ao-danger{color:#ffd8d4;border-color:rgba(198,59,50,.45);background:rgba(198,59,50,.16)}
      .ao-badge{display:inline-grid;min-width:24px;height:24px;margin-left:6px;padding:0 6px;place-items:center;border-radius:999px;color:#061906;background:#fff200}
      .ao-backdrop{position:fixed;inset:0;z-index:12000;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
      .ao-drawer{position:fixed;top:0;right:0;bottom:0;z-index:12001;width:min(520px,96vw);overflow-y:auto;padding:22px;color:#fff;background:linear-gradient(160deg,rgba(11,76,18,.98),rgba(6,25,6,.99));box-shadow:-22px 0 55px rgba(0,0,0,.42)}
      .ao-backdrop[hidden],.ao-drawer[hidden]{display:none}
      .ao-drawer-header,.ao-card-header,.ao-card-actions,.ao-person{display:flex;gap:12px;align-items:center;justify-content:space-between}
      .ao-drawer-header h2{margin:3px 0 0}.ao-drawer-header small{color:#fff200;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
      .ao-icon-btn{display:grid;width:34px;height:34px;padding:0;place-items:center;border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;background:rgba(255,255,255,.07);font-size:20px;cursor:pointer}
      .ao-message{min-height:22px;margin:14px 0;font-size:12px}.ao-message.is-success{color:#b9ffbf}.ao-message.is-error{color:#ffd8d4}.ao-message.is-working{color:#fff200}
      .ao-create-grid{display:grid;gap:10px;margin-bottom:16px}
      .ao-create-grid input,.ao-field input{width:100%;min-height:42px;padding:9px 12px;border:1px solid rgba(255,255,255,.16);border-radius:12px;outline:none;color:#fff;background:rgba(255,255,255,.08);font:inherit}
      .ao-bucket-list{display:grid;gap:14px}
      .ao-card{padding:15px;border:1px solid rgba(255,255,255,.11);border-radius:18px;background:rgba(255,255,255,.055)}
      .ao-card.is-active{border-color:rgba(255,242,0,.65);box-shadow:0 0 0 3px rgba(255,242,0,.08)}
      .ao-card-header small,.ao-person small{display:block;margin-top:4px;color:rgba(255,255,255,.66)}
      .ao-field{display:grid;gap:6px;margin:13px 0;font-size:11px;font-weight:800}
      .ao-person-list{display:grid;gap:8px;max-height:330px;overflow-y:auto}
      .ao-person{padding:10px;border-radius:12px;background:rgba(0,0,0,.16)}
      .ao-card-actions{flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
      .ao-empty,.ao-empty-small{padding:18px;border:1px dashed rgba(255,255,255,.16);border-radius:14px;color:rgba(255,255,255,.66);text-align:center}
      .ao-empty-small{padding:12px;font-size:12px}
      .ao-action-cell,.ao-action-header{white-space:nowrap}
      .ao-row-btn{min-height:32px;padding:6px 10px}.ao-row-btn.is-added{color:#061906;border-color:#fff200;background:#fff200}
    `;
    document.head.appendChild(style);
  }
})();
</script>
