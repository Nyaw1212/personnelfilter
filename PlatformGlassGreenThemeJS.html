<script>
// Personnel Platform — shared glass-green action theme
// Keeps the green appearance while using a lightweight performance mode.

(function () {
  "use strict";

  const STYLE_ID = "platformGlassGreenThemeStyles";
  const MODE_CLASS = "pf-performance-mode";

  function enablePerformanceMode() {
    document.documentElement.classList.add(MODE_CLASS);
    try { localStorage.setItem("pfPerformanceMode", "on"); } catch (_) {}
    return true;
  }

  function disablePerformanceMode() {
    document.documentElement.classList.remove(MODE_CLASS);
    try { localStorage.setItem("pfPerformanceMode", "off"); } catch (_) {}
    return false;
  }

  // Daily-use mode stays lightweight by default.
  let storedMode = "on";
  try { storedMode = localStorage.getItem("pfPerformanceMode") || "on"; } catch (_) {}
  if (storedMode !== "off") enablePerformanceMode();

  if (!document.getElementById(STYLE_ID)) {
    const style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent = `
      :root {
        --pf-glass-green-bg: linear-gradient(180deg, rgba(46,125,80,.20), rgba(46,125,80,.11));
        --pf-glass-green-hover: linear-gradient(180deg, rgba(46,125,80,.30), rgba(46,125,80,.18));
        --pf-glass-green-border: rgba(46,125,80,.38);
        --pf-glass-green-border-hover: rgba(46,125,80,.58);
        --pf-glass-green-text: #174b2d;
        --pf-glass-green-shadow: 0 7px 18px rgba(31,101,60,.12);
      }

      .button-primary,
      .button-ghost,
      #clearRanksButton,
      #applyNowButton,
      #restoreFromBarButton,
      .pf-report-launcher,
      [data-rp1-launch],
      .ao-row-add-button.is-added,
      .ao-row-add-button[data-selected="true"] {
        background: var(--pf-glass-green-bg) !important;
        border-color: var(--pf-glass-green-border) !important;
        color: var(--pf-glass-green-text) !important;
        box-shadow: var(--pf-glass-green-shadow) !important;
        backdrop-filter: blur(10px) saturate(125%);
        -webkit-backdrop-filter: blur(10px) saturate(125%);
        transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      }

      .button-primary:hover:not(:disabled),
      .button-ghost:hover:not(:disabled),
      #clearRanksButton:hover:not(:disabled),
      #applyNowButton:hover:not(:disabled),
      #restoreFromBarButton:hover:not(:disabled),
      .pf-report-launcher:hover:not(:disabled),
      [data-rp1-launch]:hover:not(:disabled),
      .ao-row-add-button.is-added:hover:not(:disabled),
      .ao-row-add-button[data-selected="true"]:hover:not(:disabled) {
        background: var(--pf-glass-green-hover) !important;
        border-color: var(--pf-glass-green-border-hover) !important;
        box-shadow: 0 9px 22px rgba(31,101,60,.18) !important;
        transform: translateY(-1px);
      }

      .button-primary:disabled,
      .button-ghost:disabled,
      #clearRanksButton:disabled,
      #applyNowButton:disabled,
      #restoreFromBarButton:disabled,
      .pf-report-launcher:disabled,
      [data-rp1-launch]:disabled {
        background: rgba(46,125,80,.08) !important;
        border-color: rgba(46,125,80,.18) !important;
        color: rgba(23,75,45,.48) !important;
        box-shadow: none !important;
      }

      .pf-report-type-choice.primary {
        background: var(--pf-glass-green-bg) !important;
        border-color: var(--pf-glass-green-border) !important;
        color: var(--pf-glass-green-text) !important;
        box-shadow: var(--pf-glass-green-shadow) !important;
        backdrop-filter: blur(10px) saturate(125%);
        -webkit-backdrop-filter: blur(10px) saturate(125%);
      }

      .pf-report-type-choice.primary:hover:not(:disabled) {
        background: var(--pf-glass-green-hover) !important;
        border-color: var(--pf-glass-green-border-hover) !important;
      }

      /* Daily-use performance mode: remove compositing and motion costs globally. */
      .${MODE_CLASS},
      .${MODE_CLASS} body {
        scroll-behavior: auto !important;
      }

      .${MODE_CLASS} *,
      .${MODE_CLASS} *::before,
      .${MODE_CLASS} *::after {
        animation: none !important;
        transition: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        filter: none !important;
        text-shadow: none !important;
        will-change: auto !important;
      }

      .${MODE_CLASS} :hover,
      .${MODE_CLASS} :focus,
      .${MODE_CLASS} :active {
        transform: none !important;
      }

      /* Remove large layered shadows while preserving borders and layout. */
      .${MODE_CLASS} button,
      .${MODE_CLASS} input,
      .${MODE_CLASS} select,
      .${MODE_CLASS} textarea,
      .${MODE_CLASS} article,
      .${MODE_CLASS} section,
      .${MODE_CLASS} dialog,
      .${MODE_CLASS} [class*="card"],
      .${MODE_CLASS} [class*="panel"],
      .${MODE_CLASS} [class*="modal"],
      .${MODE_CLASS} [class*="dialog"] {
        box-shadow: none !important;
      }

      .${MODE_CLASS} .button-primary:hover:not(:disabled),
      .${MODE_CLASS} .button-ghost:hover:not(:disabled),
      .${MODE_CLASS} #clearRanksButton:hover:not(:disabled),
      .${MODE_CLASS} #applyNowButton:hover:not(:disabled),
      .${MODE_CLASS} #restoreFromBarButton:hover:not(:disabled),
      .${MODE_CLASS} .pf-report-launcher:hover:not(:disabled),
      .${MODE_CLASS} [data-rp1-launch]:hover:not(:disabled),
      .${MODE_CLASS} .ao-row-add-button:hover:not(:disabled),
      .${MODE_CLASS} .pf-report-type-choice.primary:hover:not(:disabled) {
        background: var(--pf-glass-green-bg) !important;
        border-color: var(--pf-glass-green-border) !important;
        box-shadow: none !important;
        transform: none !important;
      }
    `;

    document.head.appendChild(style);
  }

  window.PFPerformanceMode = {
    enable: enablePerformanceMode,
    disable: disablePerformanceMode,
    status() {
      const enabled = document.documentElement.classList.contains(MODE_CLASS);
      console.table({
        enabled,
        hoverEffects: enabled ? "DISABLED" : "ENABLED",
        blur: enabled ? "DISABLED" : "ENABLED",
        filters: enabled ? "DISABLED" : "ENABLED",
        animations: enabled ? "DISABLED" : "ENABLED",
        heavyShadows: enabled ? "DISABLED" : "ENABLED",
      });
      return enabled;
    },
  };

  console.info("Platform lightweight theme mode active.");
})();
</script>
