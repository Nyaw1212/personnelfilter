<script>
// Personnel Platform — Name Format controls
// Delegates structured formatting to NameHandlerEngine and keeps a safe fallback.

(function () {
  "use strict";

  const platform = window.PersonnelPlatform;
  if (!platform) return;

  const STORAGE_KEY = "reassignment-v1:name-format";
  const ROOT_ID = "reassignmentPluginV1Root";
  const SCOPE = "reassignment-v1";
  const MODES = ["FIRST_INITIAL_LAST", "LAST_FIRST_INITIAL"];
  let currentMode = sessionStorage.getItem(STORAGE_KEY) || "FIRST_INITIAL_LAST";
  let scheduled = false;

  function text(value) {
    return String(value == null ? "" : value).replace(/\s+/g, " ").trim();
  }

  function normalizeMode(value) {
    return MODES.includes(value) ? value : "FIRST_INITIAL_LAST";
  }

  function nameHandler() {
    return platform.engines.get("nameHandler") || window.$PF?.name;
  }

  function formatPerson(person, mode = currentMode, includeRank = false) {
    const handler = nameHandler();
    if (handler?.format) {
      return handler.format(person, {
        includeRank,
        middleInitial: true,
        order: normalizeMode(mode) === "LAST_FIRST_INITIAL" ? "LAST_FIRST" : "FIRST_LAST",
      });
    }

    const rank = text(person?.rank || person?.record?.Rank || person?.Rank);
    const fullName = text(person?.fullName || person?.record?.["Full Name"] || person?.["Full Name"]);
    return [includeRank ? rank : "", fullName].filter(Boolean).join(" ").toUpperCase();
  }

  function updateVisibleNames() {
    const root = document.getElementById(ROOT_ID);
    const assignmentCore = platform.engines.get("assignmentCore");
    if (!root || root.hidden || !assignmentCore) return;

    const state = assignmentCore.get(SCOPE);
    const people = new Map(state?.participants || []);

    root.querySelectorAll(".rp1-person").forEach(row => {
      const key = row.querySelector("[data-rp1-check]")?.dataset.rp1Check;
      const label = row.querySelector(".rp1-person-name");
      if (label && key) label.textContent = formatPerson(people.get(key) || {}, currentMode, true);
    });

    root.querySelectorAll(".rp1-assigned").forEach(row => {
      const key = row.querySelector("[data-rp1-remove]")?.dataset.rp1Remove;
      const label = row.querySelector("span");
      if (label && key) label.textContent = formatPerson(people.get(key) || {}, currentMode, true);
    });
  }

  function addStyles() {
    if (document.getElementById("platformNameFormatStyles")) return;
    const style = document.createElement("style");
    style.id = "platformNameFormatStyles";
    style.textContent = `
      .rp1-phase3-tools { justify-content:flex-end !important; }
      .rp1-display-tool { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
      .rp1-display-tool label { font-size:12px; font-weight:800; white-space:nowrap; }
      .rp1-display-tool select { width:auto; min-width:160px; margin:0; padding:8px; }
    `;
    document.head.appendChild(style);
  }

  function decorate() {
    scheduled = false;
    const root = document.getElementById(ROOT_ID);
    if (!root || root.hidden) return;

    addStyles();
    const sort = root.querySelector("#rp1Step3Sort");
    const tools = sort?.closest(".rp1-phase3-tools");

    if (sort && tools) {
      const existingSortLabel = [...tools.querySelectorAll(":scope > label")][0];
      if (existingSortLabel) existingSortLabel.textContent = "Sort";

      if (!sort.closest(".rp1-display-tool")) {
        const sortGroup = document.createElement("div");
        sortGroup.className = "rp1-display-tool";
        const label = existingSortLabel || document.createElement("label");
        label.textContent = "Sort";
        tools.insertBefore(sortGroup, label);
        sortGroup.append(label, sort);
      }

      if (!tools.querySelector("#rp1NameFormat")) {
        const group = document.createElement("div");
        group.className = "rp1-display-tool";
        group.innerHTML = `
          <label for="rp1NameFormat">Name format</label>
          <select id="rp1NameFormat" class="rp1-search">
            <option value="FIRST_INITIAL_LAST">First name M Last name</option>
            <option value="LAST_FIRST_INITIAL">Last name, First name M</option>
          </select>
        `;
        tools.appendChild(group);
        group.querySelector("select").value = currentMode;
      }
    }

    updateVisibleNames();
  }

  function scheduleDecorate() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(decorate);
  }

  function formatPayload(payload) {
    if (!payload || text(payload.reportType).toUpperCase() !== "REASSIGNMENT") return payload;
    const next = structuredClone(payload);
    next.nameFormat = currentMode;
    next.personnel = (Array.isArray(next.personnel) ? next.personnel : []).map(person => ({
      ...person,
      originalFullName: text(person.originalFullName || person.fullName),
      fullName: formatPerson(person, currentMode, false),
      displayName: formatPerson(person, currentMode, true),
    }));
    return next;
  }

  const generator = platform.engines.get("generator");
  if (generator && !generator.__nameFormatWrapped) {
    const originalGenerate = generator.generate.bind(generator);
    generator.generate = function (reportType, payload, context = {}) {
      return originalGenerate(reportType, formatPayload(payload), context);
    };
    Object.defineProperty(generator, "__nameFormatWrapped", { value: true });
  }

  document.addEventListener("change", event => {
    if (event.target.id !== "rp1NameFormat") return;
    currentMode = normalizeMode(event.target.value);
    sessionStorage.setItem(STORAGE_KEY, currentMode);
    updateVisibleNames();
    platform.events.emit("name-format:changed", { mode: currentMode });
  });

  platform.events.on(`assignment-core:changed:${SCOPE}`, scheduleDecorate);
  platform.events.on("selection:changed", scheduleDecorate);

  const engine = {
    version: "2.0.0",
    modes: [...MODES],
    format: formatPerson,
    formatPayload,
    get mode() { return currentMode; },
    setMode(value) {
      currentMode = normalizeMode(value);
      sessionStorage.setItem(STORAGE_KEY, currentMode);
      scheduleDecorate();
      platform.events.emit("name-format:changed", { mode: currentMode });
      return currentMode;
    },
    status() {
      const report = {
        version: this.version,
        mode: currentMode,
        nameHandler: Boolean(nameHandler()),
        generatorWrapped: Boolean(generator?.__nameFormatWrapped),
      };
      console.table(report);
      return report;
    },
  };

  if (platform.engines.has("nameFormat")) platform.engines.replace("nameFormat", engine);
  else platform.engines.register("nameFormat", engine);

  window.$PF = window.$PF || {};
  window.$PF.nameFormat = engine;
  scheduleDecorate();
  console.info("NameFormatEngine v2.0.0 active with NameHandlerEngine fallback.");
})();
</script>
