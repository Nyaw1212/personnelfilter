<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>
    :root {
      --green-950: #041604;
      --green-900: #072507;
      --green-850: #09370d;
      --green-800: #0b4c12;
      --green-700: #087a12;
      --green-600: #00a814;
      --green-500: #00e51a;

      --yellow-500: #fff200;
      --yellow-400: #ffe600;

      --white: #ffffff;

      --text-main: rgba(255, 255, 255, 0.94);
      --text-muted: rgba(255, 255, 255, 0.62);
      --border: rgba(255, 255, 255, 0.11);
      --danger: #c63b32;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      padding: 10px;
      color: var(--text-main);

      background:
        radial-gradient(
          circle at 95% 2%,
          rgba(255, 242, 0, 0.13),
          transparent 22%
        ),
        linear-gradient(
          145deg,
          var(--green-950),
          var(--green-800)
        );

      font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 12px;
    }

    .app {
      min-height: calc(100vh - 20px);
      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        linear-gradient(
          160deg,
          rgba(11, 76, 18, 0.97),
          rgba(4, 22, 4, 0.99)
        );

      box-shadow:
        0 18px 40px
        rgba(0, 0, 0, 0.30);
    }

    .header {
      padding: 17px 16px 14px;

      border-bottom:
        1px solid
        var(--border);

      background:
        linear-gradient(
          90deg,
          rgba(0, 229, 26, 0.09),
          rgba(255, 242, 0, 0.045)
        );
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--yellow-500);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      color: var(--white);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .content {
      padding: 14px;
    }

    .status {
      display: none;
      align-items: center;
      gap: 8px;

      min-height: 38px;
      margin-bottom: 12px;
      padding: 9px 11px;

      border:
        1px solid
        rgba(255, 242, 0, 0.18);

      border-radius: 11px;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
      font-size: 10px;
    }

    .status.visible {
      display: flex;
    }

    .status.error {
      color: #ffd8d4;
      border-color: rgba(198, 59, 50, 0.38);
      background: rgba(198, 59, 50, 0.18);
    }

    .status-dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow-500);

      box-shadow:
        0 0 0 4px
        rgba(255, 242, 0, 0.09),
        0 0 9px
        rgba(255, 242, 0, 0.6);
    }

    .status.busy .status-dot {
      animation:
        statusPulse
        900ms
        ease-in-out
        infinite;
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 0.4;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    .total-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 11px;
    }

    .total-card {
      min-width: 0;
      min-height: 64px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 9px 4px;

      border:
        1px solid
        rgba(255, 242, 0, 0.32);

      border-radius: 13px;
      text-align: center;

      background:
        linear-gradient(
          155deg,
          rgba(0, 0, 0, 0.24),
          rgba(0, 0, 0, 0.12)
        );

      box-shadow:
        inset 0 1px 0
        rgba(255, 255, 255, 0.04),
        0 7px 14px
        rgba(0, 0, 0, 0.12);
    }

    .total-number {
      display: block;
      max-width: 100%;
      overflow: hidden;
      color: var(--yellow-500);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .total-label {
      display: block;
      margin-top: 6px;
      color: var(--white);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .filter-status {
      display: flex;
      align-items: center;
      gap: 9px;

      min-height: 40px;
      margin-bottom: 16px;
      padding: 9px 11px;

      border:
        1px solid
        var(--border);

      border-radius: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.055);
      font-size: 10px;
    }

    .filter-status-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .filter-status-dot.active {
      background: var(--yellow-500);

      box-shadow:
        0 0 0 4px
        rgba(255, 242, 0, 0.08),
        0 0 10px
        rgba(255, 242, 0, 0.65);
    }

    .filter-status-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-sections {
      display: grid;
      gap: 18px;
    }

    .summary-section {
      overflow: hidden;
      background: transparent;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      width: 100%;
      margin: 0 0 5px;
      padding: 0 0 9px;

      border: 0;
      border-bottom:
        1px solid
        rgba(255, 242, 0, 0.34);

      color: var(--white);
      background: transparent;
      cursor: pointer;
      user-select: none;
    }

    .section-header:hover .section-title {
      color: var(--yellow-500);
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .section-icon {
      display: grid;
      flex: 0 0 auto;

      width: 27px;
      height: 27px;
      place-items: center;

      border:
        1px solid
        rgba(255, 242, 0, 0.42);

      border-radius: 8px;
      color: var(--yellow-500);
      background: rgba(0, 0, 0, 0.18);
      font-size: 12px;
      line-height: 1;
    }

    .section-title {
      overflow: hidden;
      color: var(--white);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 140ms ease;
    }

    .section-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .section-total {
      min-width: 37px;
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--green-950);
      background: var(--yellow-500);
      font-size: 9px;
      font-weight: 900;
      text-align: center;

      box-shadow:
        0 4px 10px
        rgba(255, 242, 0, 0.13);
    }

    .section-arrow {
      color: var(--yellow-500);
      font-size: 9px;
      transition: transform 160ms ease;
    }

    .summary-section.collapsed .section-arrow {
      transform: rotate(-90deg);
    }

    .section-content {
      max-height: 310px;
      overflow-y: auto;
      padding: 0 3px;
    }

    .summary-section.collapsed .section-content {
      display: none;
    }

    .summary-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;

      min-height: 48px;
      padding: 8px 1px;

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.065);
    }

    .summary-item:last-child {
      border-bottom: 0;
    }

    .item-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .item-label {
      display: block;
      min-width: 0;
      overflow: hidden;
      color: var(--text-main);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.3;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .item-meta {
      flex: 0 0 auto;
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }

    .item-percentage {
      color: var(--yellow-500);
    }

    .item-bar-track {
      position: relative;
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
    }

    .item-bar {
      width: 0;
      height: 100%;
      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--green-500) 0%,
          #9dff00 58%,
          var(--yellow-500) 100%
        );

      box-shadow:
        0 0 7px
        rgba(0, 229, 26, 0.25);

      transition:
        width 420ms
        cubic-bezier(
          0.22,
          1,
          0.36,
          1
        );
    }

    .empty-message {
      padding: 16px 4px;
      color: var(--text-muted);
      font-size: 10px;
      text-align: center;
    }

    .refresh-button {
      width: 100%;
      height: 43px;
      margin-top: 17px;
      padding: 0 15px;

      border: 0;
      border-radius: 13px;

      color: var(--green-950);

      background:
        linear-gradient(
          135deg,
          var(--yellow-500),
          #fff88b
        );

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;

      box-shadow:
        0 8px 17px
        rgba(0, 0, 0, 0.17);

      transition:
        transform 140ms ease,
        opacity 140ms ease,
        box-shadow 140ms ease;
    }

    .refresh-button:hover:not(:disabled) {
      transform: translateY(-1px);

      box-shadow:
        0 10px 21px
        rgba(0, 0, 0, 0.23);
    }

    .refresh-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .footer {
      margin-top: 11px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 8px;
      line-height: 1.5;
      text-align: center;
    }

    * {
      scrollbar-width: thin;

      scrollbar-color:
        rgba(255, 242, 0, 0.42)
        rgba(0, 0, 0, 0.13);
    }

    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    *::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.13);
    }

    *::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(255, 242, 0, 0.42);
    }

    @media (max-width: 340px) {
      body {
        padding: 7px;
      }

      .content {
        padding: 11px;
      }

      .total-grid {
        gap: 5px;
      }

      .total-card {
        min-height: 58px;
      }

      .total-number {
        font-size: 17px;
      }

      .total-label {
        font-size: 7px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <p class="eyebrow">
        NBP Personnel System
      </p>

      <h1 class="title">
        Personnel Summary
      </h1>

      <p
        id="headerUpdated"
        class="subtitle"
      >
        Loading summary report...
      </p>
    </header>

    <section class="content">

      <div
        id="status"
        class="status visible busy"
      >
        <span class="status-dot"></span>

        <span id="statusText">
          Updating personnel summary...
        </span>
      </div>

      <div class="total-grid">

        <div class="total-card">
          <span
            id="visibleCount"
            class="total-number"
          >
            —
          </span>

          <span class="total-label">
            Visible
          </span>
        </div>

        <div class="total-card">
          <span
            id="hiddenCount"
            class="total-number"
          >
            —
          </span>

          <span class="total-label">
            Hidden
          </span>
        </div>

        <div class="total-card">
          <span
            id="totalCount"
            class="total-number"
          >
            —
          </span>

          <span class="total-label">
            Total
          </span>
        </div>

      </div>

      <div class="filter-status">
        <span
          id="filterStatusDot"
          class="filter-status-dot"
        ></span>

        <span
          id="filterStatusText"
          class="filter-status-text"
        >
          Loading filter status...
        </span>
      </div>

      <div
        id="summarySections"
        class="summary-sections"
      ></div>

      <button
        id="refreshButton"
        class="refresh-button"
        type="button"
      >
        Refresh Summary
      </button>

      <footer
        id="footer"
        class="footer"
      >
        Waiting for report...
      </footer>

    </section>

  </main>

  <script>
    const SUMMARY_SECTION_ORDER = [
      "camp",
      "category",
      "gender",
      "rank",
      "type"
    ];

    const SUMMARY_SECTION_ICONS = {
      camp: "🏢",
      category: "👥",
      gender: "♀",
      rank: "★",
      type: "🛡"
    };

    let summaryRequestRunning = false;

    document.addEventListener(
      "DOMContentLoaded",
      function () {
        document
          .getElementById(
            "refreshButton"
          )
          .addEventListener(
            "click",
            loadSummary_
          );

        loadSummary_();
      }
    );

    function loadSummary_() {
      if (summaryRequestRunning) {
        return;
      }

      summaryRequestRunning = true;

      setBusyState_(
        true
      );

      showStatus_(
        "Updating personnel summary...",
        false
      );

      google.script.run
        .withSuccessHandler(
          function (report) {
            summaryRequestRunning = false;

            setBusyState_(
              false
            );

            hideStatus_();

            renderSummary_(
              report || {}
            );
          }
        )
        .withFailureHandler(
          function (error) {
            summaryRequestRunning = false;

            setBusyState_(
              false
            );

            showStatus_(
              error && error.message
                ? error.message
                : String(error),
              true
            );
          }
        )
        .getPersonnelSummaryReport();
    }

    function renderSummary_(
      report
    ) {
      setText_(
        "visibleCount",
        formatNumber_(
          report.visibleCount
        )
      );

      setText_(
        "hiddenCount",
        formatNumber_(
          report.hiddenCount
        )
      );

      setText_(
        "totalCount",
        formatNumber_(
          report.totalCount
        )
      );

      renderFilterStatus_(
        report.hasActiveFilters
      );

      renderSections_(
        report.sections || {}
      );

      const updatedAt =
        String(
          report.updatedAt || ""
        );

      setText_(
        "headerUpdated",
        updatedAt
          ? "Updated " + updatedAt
          : "Personnel totals by camp, category, gender, rank and type."
      );

      setText_(
        "footer",
        updatedAt
          ? "Updated " +
            updatedAt +
            " • " +
            formatNumber_(
              report.elapsedMs
            ) +
            " ms"
          : "Summary ready"
      );
    }

    function renderFilterStatus_(
      hasActiveFilters
    ) {
      const dot =
        document.getElementById(
          "filterStatusDot"
        );

      const text =
        document.getElementById(
          "filterStatusText"
        );

      dot.classList.toggle(
        "active",
        Boolean(
          hasActiveFilters
        )
      );

      text.textContent =
        hasActiveFilters
          ? "Filter active — summary reflects the filtered personnel."
          : "No active filter — summary includes all personnel.";
    }

    function renderSections_(
      sections
    ) {
      const container =
        document.getElementById(
          "summarySections"
        );

      container.innerHTML = "";

      SUMMARY_SECTION_ORDER.forEach(
        function (key) {
          const section =
            sections[key];

          if (!section) {
            return;
          }

          container.appendChild(
            createSummarySection_(
              section,
              key
            )
          );
        }
      );

      if (!container.children.length) {
        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty-message";

        empty.textContent =
          "No summary sections were returned.";

        container.appendChild(
          empty
        );
      }
    }

    function createSummarySection_(
      section,
      key
    ) {
      const wrapper =
        document.createElement(
          "section"
        );

      wrapper.className =
        "summary-section";

      const header =
        document.createElement(
          "div"
        );

      header.className =
        "section-header";

      header.setAttribute(
        "role",
        "button"
      );

      header.setAttribute(
        "tabindex",
        "0"
      );

      const heading =
        document.createElement(
          "div"
        );

      heading.className =
        "section-heading";

      const icon =
        document.createElement(
          "span"
        );

      icon.className =
        "section-icon";

      icon.textContent =
        SUMMARY_SECTION_ICONS[key] ||
        "•";

      const title =
        document.createElement(
          "span"
        );

      title.className =
        "section-title";

      title.textContent =
        section.label ||
        key;

      heading.appendChild(
        icon
      );

      heading.appendChild(
        title
      );

      const right =
        document.createElement(
          "div"
        );

      right.className =
        "section-right";

      const total =
        document.createElement(
          "span"
        );

      total.className =
        "section-total";

      total.textContent =
        formatNumber_(
          section.total
        );

      const arrow =
        document.createElement(
          "span"
        );

      arrow.className =
        "section-arrow";

      arrow.textContent =
        "▼";

      right.appendChild(
        total
      );

      right.appendChild(
        arrow
      );

      header.appendChild(
        heading
      );

      header.appendChild(
        right
      );

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "section-content";

      const items =
        Array.isArray(
          section.items
        )
          ? section.items
          : [];

      if (!items.length) {
        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty-message";

        empty.textContent =
          "No personnel records";

        content.appendChild(
          empty
        );
      } else {
        const maximumCount =
          Math.max.apply(
            null,
            items.map(
              function (item) {
                return Number(
                  item.count || 0
                );
              }
            )
          ) || 1;

        const sectionTotal =
          Number(
            section.total || 0
          );

        items.forEach(
          function (item) {
            content.appendChild(
              createSummaryItem_(
                item,
                maximumCount,
                sectionTotal
              )
            );
          }
        );
      }

      function toggleSection_() {
        wrapper.classList.toggle(
          "collapsed"
        );
      }

      header.addEventListener(
        "click",
        toggleSection_
      );

      header.addEventListener(
        "keydown",
        function (event) {
          if (
            event.key === "Enter" ||
            event.key === " "
          ) {
            event.preventDefault();

            toggleSection_();
          }
        }
      );

      wrapper.appendChild(
        header
      );

      wrapper.appendChild(
        content
      );

      return wrapper;
    }

    function createSummaryItem_(
      item,
      maximumCount,
      sectionTotal
    ) {
      const row =
        document.createElement(
          "div"
        );

      row.className =
        "summary-item";

      const heading =
        document.createElement(
          "div"
        );

      heading.className =
        "item-heading";

      const label =
        document.createElement(
          "span"
        );

      label.className =
        "item-label";

      label.textContent =
        item.label ||
        "Unspecified";

      label.title =
        item.label ||
        "Unspecified";

      const count =
        Number(
          item.count || 0
        );

      const percentage =
        sectionTotal > 0
          ? (
              count /
              sectionTotal
            ) *
            100
          : 0;

      const meta =
        document.createElement(
          "span"
        );

      meta.className =
        "item-meta";

      const countText =
        document.createTextNode(
          formatNumber_(
            count
          ) +
          " · "
        );

      const percentageText =
        document.createElement(
          "span"
        );

      percentageText.className =
        "item-percentage";

      percentageText.textContent =
        percentage.toFixed(1) +
        "%";

      meta.appendChild(
        countText
      );

      meta.appendChild(
        percentageText
      );

      heading.appendChild(
        label
      );

      heading.appendChild(
        meta
      );

      const track =
        document.createElement(
          "div"
        );

      track.className =
        "item-bar-track";

      const bar =
        document.createElement(
          "div"
        );

      bar.className =
        "item-bar";

      track.appendChild(
        bar
      );

      row.appendChild(
        heading
      );

      row.appendChild(
        track
      );

      const barPercentage =
        maximumCount > 0
          ? Math.max(
              1.5,
              Math.min(
                100,
                (
                  count /
                  maximumCount
                ) *
                100
              )
            )
          : 0;

      window.requestAnimationFrame(
        function () {
          window.requestAnimationFrame(
            function () {
              bar.style.width =
                barPercentage +
                "%";
            }
          );
        }
      );

      return row;
    }

    function setBusyState_(
      isBusy
    ) {
      document
        .getElementById(
          "refreshButton"
        )
        .disabled =
          Boolean(isBusy);
    }

    function showStatus_(
      message,
      isError
    ) {
      const status =
        document.getElementById(
          "status"
        );

      const statusText =
        document.getElementById(
          "statusText"
        );

      statusText.textContent =
        message;

      status.classList.add(
        "visible"
      );

      status.classList.toggle(
        "busy",
        !isError
      );

      status.classList.toggle(
        "error",
        Boolean(isError)
      );
    }

    function hideStatus_() {
      const status =
        document.getElementById(
          "status"
        );

      status.classList.remove(
        "visible",
        "busy",
        "error"
      );
    }

    function setText_(
      elementId,
      value
    ) {
      const element =
        document.getElementById(
          elementId
        );

      if (element) {
        element.textContent =
          value;
      }
    }

    function formatNumber_(
      value
    ) {
      return Number(
        value || 0
      ).toLocaleString();
    }
  </script>
</body>
</html>
