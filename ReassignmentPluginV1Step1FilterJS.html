<script>
// Reassignment V1 Step 1 filter adapter v1.1.0
// Uses direct control listeners and wraps the plugin render method.
(function () {
  "use strict";

  const ROOT_ID = "reassignmentPluginV1Root";
  const SCOPE = "reassignment-v1";
  const platform = window.PersonnelPlatform;
  const assignment = platform?.engines?.get?.("assignmentCore");
  if (!platform || !assignment) return;

  const uiState = {
    searchText: "",
    ranks: new Set(),
    locations: new Set(),
    selectionMode: "ALL"
  };

  const text = value => String(value == null ? "" : value).trim();
  const norm = value => text(value)
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Z0-9]+/gi, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase();

  function escapeHtml(value) {
    return text(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function installStyles() {
    if (document.getElementById("rp1Step1FilterStyles")) return;
    const style = document.createElement("style");
    style.id = "rp1Step1FilterStyles";
    style.textContent = `
      .rp1-step1-filter{margin-bottom:10px;padding:10px;border:1px solid #d5e6d9;border-radius:12px;background:#f2f9f3}
      .rp1-step1-filter textarea{width:100%;min-height:74px;resize:vertical;box-sizing:border-box;border:1px solid #bfd5c5;border-radius:9px;padding:9px 10px;font:inherit;background:#fff}
      .rp1-step1-filter-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
      .rp1-step1-filter-title{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
      .rp1-filter-section{margin-top:9px}
      .rp1-filter-label{display:block;margin-bottom:5px;font-size:10px;font-weight:900;opacity:.72;text-transform:uppercase;letter-spacing:.05em}
      .rp1-filter-chips{display:flex;flex-wrap:wrap;gap:5px;max-height:82px;overflow:auto}
      .rp1-filter-chip{border:1px solid #bfd5c5;border-radius:999px;background:#fff;color:#173d23;padding:5px 9px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;pointer-events:auto}
      .rp1-filter-chip.active{background:#236b39;color:#fff;border-color:#236b39}
      .rp1-filter-result{margin-top:7px;font-size:11px;color:#526c59}
      .rp1-person.rp1-filter-hidden{display:none!important}
    `;
    document.head.appendChild(style);
  }

  function getPanel() {
    const root = document.getElementById(ROOT_ID);
    if (!root || root.hidden) return null;
    return root.querySelector(".rp1-grid > .rp1-panel:first-child");
  }

  function rows(panel) {
    return panel ? [...panel.querySelectorAll(".rp1-list .rp1-person")] : [];
  }

  function rowData(row) {
    const nameText = text(row.querySelector(".rp1-person-name")?.textContent);
    const location = text(row.querySelector(".rp1-person-sub")?.textContent) || "UNASSIGNED";
    const checkbox = row.querySelector("[data-rp1-check]");
    return {
      row,
      checkbox,
      key: text(checkbox?.dataset.rp1Check),
      rank: nameText.split(/\s+/)[0] || "UNRANKED",
      location,
      haystack: norm(nameText + " " + location)
    };
  }

  function unique(values) {
    return [...new Set(values.filter(Boolean))].sort((a, b) =>
      a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" })
    );
  }

  function searchTerms() {
    return text(uiState.searchText).split(/\r?\n/).map(norm).filter(Boolean);
  }

  function matches(data) {
    const terms = searchTerms();
    const checked = Boolean(data.checkbox?.checked);
    return (!terms.length || terms.some(term => data.haystack.includes(term))) &&
      (!uiState.ranks.size || uiState.ranks.has(norm(data.rank))) &&
      (!uiState.locations.size || uiState.locations.has(norm(data.location))) &&
      (uiState.selectionMode === "ALL" ||
        (uiState.selectionMode === "SELECTED" && checked) ||
        (uiState.selectionMode === "UNSELECTED" && !checked));
  }

  function chip(label, type, value, active) {
    return `<button type="button" class="rp1-filter-chip${active ? " active" : ""}" data-filter-type="${type}" data-filter-value="${escapeHtml(value)}">${escapeHtml(label)}</button>`;
  }

  function applyFilters(panel) {
    const data = rows(panel).map(rowData);
    let visible = 0;
    data.forEach(item => {
      const show = matches(item);
      item.row.classList.toggle("rp1-filter-hidden", !show);
      if (show) visible++;
    });

    const result = panel.querySelector("#rp1FilterResult");
    if (result) result.textContent = visible + " visible of " + data.length + " unassigned";
    const count = panel.querySelector("h2 small");
    if (count) count.textContent = visible + " / " + data.length;
  }

  function toggleSet(set, value) {
    if (set.has(value)) set.delete(value);
    else set.add(value);
  }

  function updateVisibleSelection(panel, selectValue) {
    const selected = new Set(assignment.get(SCOPE).selectedKeys || []);
    rows(panel).filter(row => !row.classList.contains("rp1-filter-hidden")).forEach(row => {
      const checkbox = row.querySelector("[data-rp1-check]");
      const key = text(checkbox?.dataset.rp1Check);
      if (key && selected.has(key) !== selectValue) {
        assignment.toggleSelection(SCOPE, key);
      }
    });
    window.$PF?.reassignmentV1?.render?.();
  }

  function renderFilterUi() {
    const panel = getPanel();
    if (!panel) return;

    const data = rows(panel).map(rowData);
    const ranks = unique(data.map(item => item.rank));
    const locations = unique(data.map(item => item.location));
    const old = panel.querySelector(".rp1-step1-filter");
    if (old) old.remove();

    const controls = document.createElement("div");
    controls.className = "rp1-step1-filter";
    controls.innerHTML = `
      <div class="rp1-step1-filter-head">
        <span class="rp1-step1-filter-title">Personnel filters</span>
        <button type="button" class="rp1-btn" data-filter-clear>Clear Filters</button>
      </div>
      <textarea id="rp1PersonnelMultiSearch" placeholder="Paste one personnel name per line..."></textarea>
      <div class="rp1-filter-section"><span class="rp1-filter-label">Rank</span><div class="rp1-filter-chips">
        ${chip("All", "rank-all", "ALL", !uiState.ranks.size)}
        ${ranks.map(value => chip(value, "rank", norm(value), uiState.ranks.has(norm(value)))).join("")}
      </div></div>
      <div class="rp1-filter-section"><span class="rp1-filter-label">Current location</span><div class="rp1-filter-chips">
        ${chip("All", "location-all", "ALL", !uiState.locations.size)}
        ${locations.map(value => chip(value, "location", norm(value), uiState.locations.has(norm(value)))).join("")}
      </div></div>
      <div class="rp1-filter-section"><span class="rp1-filter-label">Selection</span><div class="rp1-filter-chips">
        ${chip("All", "selection", "ALL", uiState.selectionMode === "ALL")}
        ${chip("Selected", "selection", "SELECTED", uiState.selectionMode === "SELECTED")}
        ${chip("Unselected", "selection", "UNSELECTED", uiState.selectionMode === "UNSELECTED")}
      </div></div>
      <div class="rp1-filter-result" id="rp1FilterResult"></div>`;

    const toolbar = panel.querySelector(".rp1-toolbar");
    panel.insertBefore(controls, toolbar || panel.querySelector(".rp1-list"));

    const textarea = controls.querySelector("#rp1PersonnelMultiSearch");
    textarea.value = uiState.searchText;
    textarea.addEventListener("input", () => {
      uiState.searchText = textarea.value;
      applyFilters(panel);
    });

    controls.querySelector("[data-filter-clear]").addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      uiState.searchText = "";
      uiState.ranks.clear();
      uiState.locations.clear();
      uiState.selectionMode = "ALL";
      renderFilterUi();
    });

    controls.querySelectorAll("[data-filter-type]").forEach(button => {
      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        const type = button.dataset.filterType;
        const value = button.dataset.filterValue;
        if (type === "rank-all") uiState.ranks.clear();
        else if (type === "location-all") uiState.locations.clear();
        else if (type === "rank") toggleSet(uiState.ranks, value);
        else if (type === "location") toggleSet(uiState.locations, value);
        else if (type === "selection") uiState.selectionMode = value;
        renderFilterUi();
      });
    });

    const selectAll = panel.querySelector('[data-rp1="select-all"]');
    const clearSelection = panel.querySelector('[data-rp1="clear-selection"]');
    if (selectAll) {
      selectAll.onclick = event => {
        event.preventDefault();
        event.stopImmediatePropagation();
        updateVisibleSelection(panel, true);
      };
    }
    if (clearSelection) {
      clearSelection.onclick = event => {
        event.preventDefault();
        event.stopImmediatePropagation();
        updateVisibleSelection(panel, false);
      };
    }

    applyFilters(panel);
  }

  function attach() {
    const plugin = window.$PF?.reassignmentV1;
    if (!plugin || plugin.__step1FilterWrapped) return false;

    const originalRender = plugin.render.bind(plugin);
    plugin.render = function () {
      const result = originalRender();
      requestAnimationFrame(renderFilterUi);
      return result;
    };

    const originalOpen = plugin.open.bind(plugin);
    plugin.open = function () {
      const result = originalOpen();
      requestAnimationFrame(renderFilterUi);
      return result;
    };

    plugin.__step1FilterWrapped = true;
    requestAnimationFrame(renderFilterUi);
    console.info("Reassignment V1 Step 1 filters v1.1.0 attached.");
    return true;
  }

  installStyles();
  if (!attach()) {
    let attempts = 0;
    const timer = setInterval(() => {
      attempts++;
      if (attach() || attempts >= 50) clearInterval(timer);
    }, 100);
  }
})();
</script>
