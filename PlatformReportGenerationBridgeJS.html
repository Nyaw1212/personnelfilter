<script>
// Personnel Platform — Apps Script report generation bridge
// Connects Report Designer generation requests to Stage1WorkflowServer.js
// and writes successful reassignment reports to the canonical TRANSFER_QUEUE.

(function () {
  "use strict";

  const platform = window.PersonnelPlatform;
  const report = platform?.engines?.get?.("report");
  if (!platform || !report) return;

  const inFlight = new Set();

  function text(value) {
    return String(value == null ? "" : value).trim();
  }

  function fromValue(person) {
    return text(person?.from) ||
      (text(person?.transferMode) === "CAMP_TO_CAMP"
        ? text(person?.fromCamp)
        : text(person?.fromOffice));
  }

  function toValue(person) {
    return text(person?.to) ||
      (text(person?.transferMode) === "CAMP_TO_CAMP"
        ? text(person?.toCamp)
        : text(person?.toOffice));
  }

  function serverPayload(draft) {
    const metadata = draft?.metadata || {};
    const source = draft?.payload || {};
    const personnel = Array.isArray(source.personnel) ? source.personnel : [];

    return {
      orderNumber: text(metadata.orderNumber || source?.order?.number),
      orderDate: text(metadata.orderDate || source?.order?.date),
      signingOfficer: text(metadata.signingOfficer || source?.order?.signingOfficer),
      signingPosition: text(metadata.signingPosition || source?.order?.signingPosition),
      fileReference: text(metadata.fileReference || source?.order?.fileReference),
      personnel: personnel.map((person, index) => ({
        sequence: Number(person?.sequence || index + 1),
        rank: text(person?.rank),
        fullName: text(person?.fullName),
        from: fromValue(person),
        to: toValue(person),
        fromOffice: text(person?.fromOffice),
        fromCamp: text(person?.fromCamp),
        toOffice: text(person?.toOffice),
        toCamp: text(person?.toCamp),
        transferMode: text(person?.transferMode),
        notes: text(person?.notes),
      })),
    };
  }

  function fail(draftId, message) {
    const failureMessage = text(message) || "The report could not be generated.";
    const result = report.saveResult(draftId, {
      status: "FAILED",
      success: false,
      message: failureMessage,
      generatedAt: new Date().toISOString(),
    });

    platform.events.emit("report:generation-failed", result);
    window.$PF.reportPreview?.open?.(draftId);
    window.alert(failureMessage);
    return result;
  }

  function enqueueGeneratedTransfer_(draft, response, result) {
    const payload = serverPayload(draft);

    if (!payload.personnel.length) {
      console.warn("Generated report has no personnel to enqueue.", result);
      return;
    }

    google.script.run
      .withSuccessHandler(queueResponse => {
        if (!queueResponse?.success) {
          console.error(
            "Report generated, but transfer queue write failed:",
            queueResponse?.message || queueResponse
          );
          platform.events.emit("transfer-queue:enqueue-failed", {
            draftId: draft?.id,
            result,
            response: queueResponse,
          });
          return;
        }

        console.info("Generated report added to TRANSFER_QUEUE.", queueResponse);
        platform.events.emit("transfer-queue:enqueued", {
          draftId: draft?.id,
          result,
          response: queueResponse,
        });
      })
      .withFailureHandler(error => {
        console.error("Report generated, but transfer queue request failed:", error);
        platform.events.emit("transfer-queue:enqueue-failed", {
          draftId: draft?.id,
          result,
          error,
        });
      })
      .enqueueTransferBatchCanonical(payload, response);
  }

  platform.events.on("report:generation-requested", request => {
    if (document.querySelector('meta[name="dev-mode"]')) return;

    const draftId = text(request?.draftId || request?.draft?.id);
    const draft = request?.draft || report.get(draftId);
    if (!draftId || !draft || inFlight.has(draftId)) return;

    if (!window.google?.script?.run) {
      fail(draftId, "Apps Script runtime is unavailable.");
      return;
    }

    inFlight.add(draftId);
    const payload = serverPayload(draft);

    google.script.run
      .withSuccessHandler(response => {
        inFlight.delete(draftId);

        if (!response || response.success !== true) {
          fail(draftId, response?.message || "The report generator returned an unsuccessful response.");
          return;
        }

        const result = report.saveResult(draftId, {
          ...response,
          status: "GENERATED",
          success: true,
          documentUrl: text(response.url),
          generatedAt: new Date().toISOString(),
        });

        // Direct integration: every successfully generated reassignment is
        // persisted to the canonical TRANSFER_QUEUE sheet.
        enqueueGeneratedTransfer_(draft, response, result);

        window.$PF.reportPreview?.close?.();
        console.info("Apps Script report generation completed.", result);
      })
      .withFailureHandler(error => {
        inFlight.delete(draftId);
        fail(draftId, error?.message || String(error || "Report generation failed."));
      })
      .sendStage1ReassignmentToAogen(payload);
  });

  window.$PF.reportGenerationBridge = {
    version: "1.1.0",
    payload: draftOrId => serverPayload(
      typeof draftOrId === "string" ? report.get(draftOrId) : draftOrId
    ),
    status() {
      const state = {
        version: this.version,
        mode: document.querySelector('meta[name="dev-mode"]') ? "DEVELOPER" : "APPS_SCRIPT",
        inFlight: inFlight.size,
        queueEndpoint: "enqueueTransferBatchCanonical",
      };
      console.table(state);
      return state;
    },
  };

  console.info("ReportGenerationBridge v1.1.0 active with canonical queue integration.");
})();
</script>
