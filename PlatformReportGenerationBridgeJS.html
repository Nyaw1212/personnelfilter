<script>
// Personnel Platform — Apps Script report generation bridge
// Connects Report Designer generation requests to Stage1WorkflowServer.js
// and writes successful reassignment reports to the canonical TRANSFER_QUEUE.

(function () {
  "use strict";

  const platform = window.PersonnelPlatform;
  const report = platform?.engines?.get?.("report");
  const selection = platform?.engines?.get?.("selection");
  if (!platform || !report) return;

  const inFlight = new Set();
  const TOAST_ID = "reportGenerationProgressToast";

  function text(value) {
    return String(value == null ? "" : value).trim();
  }

  function fromValue(person) {
    return text(person?.from) ||
      (text(person?.transferMode) === "CAMP_TO_CAMP"
        ? text(person?.fromCamp)
        : text(person?.fromOffice));
  }

  function toValue(person) {
    return text(person?.to) ||
      (text(person?.transferMode) === "CAMP_TO_CAMP"
        ? text(person?.toCamp)
        : text(person?.toOffice));
  }

  function serverPayload(draft) {
    const metadata = draft?.metadata || {};
    const source = draft?.payload || {};
    const personnel = Array.isArray(source.personnel) ? source.personnel : [];

    return {
      orderNumber: text(metadata.orderNumber || source?.order?.number),
      orderDate: text(metadata.orderDate || source?.order?.date),
      signingOfficer: text(metadata.signingOfficer || source?.order?.signingOfficer),
      signingPosition: text(metadata.signingPosition || source?.order?.signingPosition),
      fileReference: text(metadata.fileReference || source?.order?.fileReference),
      personnel: personnel.map((person, index) => ({
        sequence: Number(person?.sequence || index + 1),
        rank: text(person?.rank),
        fullName: text(person?.fullName),
        from: fromValue(person),
        to: toValue(person),
        fromOffice: text(person?.fromOffice),
        fromCamp: text(person?.fromCamp),
        toOffice: text(person?.toOffice),
        toCamp: text(person?.toCamp),
        transferMode: text(person?.transferMode),
        notes: text(person?.notes),
      })),
    };
  }

  function ensureToastStyles_() {
    if (document.getElementById("reportGenerationProgressToastStyles")) return;
    const style = document.createElement("style");
    style.id = "reportGenerationProgressToastStyles";
    style.textContent = `
      #${TOAST_ID}{position:fixed;left:18px;bottom:22px;z-index:20050;display:flex;align-items:center;gap:12px;min-width:330px;max-width:min(620px,calc(100vw - 36px));padding:12px 14px;border:1px solid #c9ddcd;border-radius:14px;background:#f8fcf8;box-shadow:0 12px 34px rgba(0,0,0,.18);color:#153c21}
      #${TOAST_ID}[hidden]{display:none!important}
      #${TOAST_ID}.is-working{background:#fff9d6;border-color:#eadb7d}
      #${TOAST_ID}.is-success{background:#edf9ef;border-color:#afd0b6}
      #${TOAST_ID}.is-error{background:#fff0f0;border-color:#e3b1b1}
      #${TOAST_ID} .rg-toast-main{min-width:0;flex:1}
      #${TOAST_ID} strong,#${TOAST_ID} small{display:block}
      #${TOAST_ID} small{margin-top:2px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #${TOAST_ID} .rg-toast-actions{display:flex;gap:7px;flex-wrap:wrap}
      #${TOAST_ID} button,#${TOAST_ID} a{border:1px solid #bdd2c1;border-radius:9px;background:#fff;padding:7px 10px;color:inherit;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}
    `;
    document.head.appendChild(style);
  }

  function showToast_(title, detail, type, actions) {
    ensureToastStyles_();
    let toast = document.getElementById(TOAST_ID);
    if (!toast) {
      toast = document.createElement("aside");
      toast.id = TOAST_ID;
      document.body.appendChild(toast);
    }

    toast.className = `is-${type || "working"}`;
    toast.hidden = false;
    toast.replaceChildren();

    const main = document.createElement("div");
    main.className = "rg-toast-main";
    const heading = document.createElement("strong");
    heading.textContent = title;
    const sub = document.createElement("small");
    sub.textContent = detail || "";
    main.append(heading, sub);
    toast.appendChild(main);

    if (Array.isArray(actions) && actions.length) {
      const host = document.createElement("div");
      host.className = "rg-toast-actions";
      actions.forEach(action => {
        const el = action.href ? document.createElement("a") : document.createElement("button");
        el.textContent = action.label;
        if (action.href) {
          el.href = action.href;
          el.target = "_blank";
          el.rel = "noopener noreferrer";
        } else {
          el.type = "button";
          el.addEventListener("click", action.onClick);
        }
        host.appendChild(el);
      });
      toast.appendChild(host);
    }
  }

  function returnToPersonnelFilter_() {
    window.$PF?.reportPreview?.close?.();
    window.$PF?.reportLauncher?.close?.();

    const reassignmentRoot = document.getElementById("reassignmentPluginV1Root");
    if (reassignmentRoot) reassignmentRoot.hidden = true;
    document.body.style.overflow = "";
  }

  function clearPersonnelSelection_() {
    try {
      if (typeof window.deselectAllPersonnelFromAo_ === "function") {
        window.deselectAllPersonnelFromAo_();
      } else if (selection?.clear) {
        selection.clear("ao-cart");
      } else if (selection?.reset) {
        selection.reset("ao-cart");
      }
    } catch (error) {
      console.warn("Unable to clear AO selection through selection engine:", error);
    }

    document.querySelectorAll('[data-personnel-check], [data-ao-check], input[type="checkbox"][data-personnel-key]')
      .forEach(box => { box.checked = false; });

    try { window.filterAndRenderPersonnel?.(); } catch (_) {}
    try { window.renderPreviewTable?.(); } catch (_) {}
  }

  function fail(draftId, message) {
    const failureMessage = text(message) || "The report could not be generated.";
    const result = report.saveResult(draftId, {
      status: "FAILED",
      success: false,
      message: failureMessage,
      generatedAt: new Date().toISOString(),
    });

    platform.events.emit("report:generation-failed", result);
    returnToPersonnelFilter_();
    showToast_("Report generation failed", failureMessage, "error", [
      { label: "View Reports", onClick: () => window.openGeneratedReportsDialog?.() }
    ]);
    return result;
  }

  function enqueueGeneratedTransfer_(draft, response, result) {
    const payload = serverPayload(draft);

    if (!payload.personnel.length) {
      console.warn("Generated report has no personnel to enqueue.", result);
      return;
    }

    google.script.run
      .withSuccessHandler(queueResponse => {
        if (!queueResponse?.success) {
          console.error("Report generated, but transfer queue write failed:", queueResponse?.message || queueResponse);
          platform.events.emit("transfer-queue:enqueue-failed", { draftId: draft?.id, result, response: queueResponse });
          return;
        }
        platform.events.emit("transfer-queue:enqueued", { draftId: draft?.id, result, response: queueResponse });
      })
      .withFailureHandler(error => {
        console.error("Report generated, but transfer queue request failed:", error);
        platform.events.emit("transfer-queue:enqueue-failed", { draftId: draft?.id, result, error });
      })
      .enqueueTransferBatchCanonical(payload, response);
  }

  platform.events.on("report:generation-requested", request => {
    if (document.querySelector('meta[name="dev-mode"]')) return;

    const draftId = text(request?.draftId || request?.draft?.id);
    const draft = request?.draft || report.get(draftId);
    if (!draftId || !draft || inFlight.has(draftId)) return;

    if (!window.google?.script?.run) {
      fail(draftId, "Apps Script runtime is unavailable.");
      return;
    }

    inFlight.add(draftId);
    const payload = serverPayload(draft);

    returnToPersonnelFilter_();
    clearPersonnelSelection_();
    showToast_("Generating report…", "You may continue working while the report is being created.", "working");

    google.script.run
      .withSuccessHandler(response => {
        inFlight.delete(draftId);

        if (!response || response.success !== true) {
          fail(draftId, response?.message || "The report generator returned an unsuccessful response.");
          return;
        }

        const result = report.saveResult(draftId, {
          ...response,
          status: "GENERATED",
          success: true,
          documentUrl: text(response.url),
          generatedAt: new Date().toISOString(),
        });

        enqueueGeneratedTransfer_(draft, response, result);
        returnToPersonnelFilter_();

        showToast_("Report generated successfully", `Order ${payload.orderNumber || "reassignment"}`, "success", [
          ...(text(response.url) ? [{ label: "Open Report", href: text(response.url) }] : []),
          { label: "View Reports", onClick: () => window.openGeneratedReportsDialog?.() }
        ]);

        platform.events.emit("report:generation-completed", result);
        console.info("Apps Script report generation completed.", result);
      })
      .withFailureHandler(error => {
        inFlight.delete(draftId);
        fail(draftId, error?.message || String(error || "Report generation failed."));
      })
      .sendStage1ReassignmentToAogen(payload);
  });

  window.$PF.reportGenerationBridge = {
    version: "1.2.0",
    payload: draftOrId => serverPayload(typeof draftOrId === "string" ? report.get(draftOrId) : draftOrId),
    status() {
      const state = {
        version: this.version,
        mode: document.querySelector('meta[name="dev-mode"]') ? "DEVELOPER" : "APPS_SCRIPT",
        inFlight: inFlight.size,
        queueEndpoint: "enqueueTransferBatchCanonical",
      };
      console.table(state);
      return state;
    },
  };

  console.info("ReportGenerationBridge v1.2.0 active with background generation workflow.");
})();
</script>
