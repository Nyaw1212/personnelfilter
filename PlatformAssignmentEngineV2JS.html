<script>
// Personnel Platform — AssignmentEngine v0.3.1 migration
// Developer Mode only: platform state is canonical, legacy reassignment state is mirrored.

(function () {
  "use strict";

  const platform = window.PersonnelPlatform;
  if (!platform) return;

  const SCOPE = "reassignment";
  const STATE_SCOPE = `assignment:${SCOPE}`;
  const STORE_NAMESPACE = "assignment";
  const STORE_KEY = SCOPE;
  const MAX_HISTORY = 30;

  function text_(value) {
    return String(value === null || value === undefined ? "" : value).trim();
  }

  function normalizeMode_(value) {
    return value === "CAMP_TO_CAMP" ? "CAMP_TO_CAMP" : "OFFICE_TO_OFFICE";
  }

  function normalizeDestination_(mode, value) {
    return {
      type: mode === "CAMP_TO_CAMP" ? "CAMP" : "OFFICE",
      value: text_(value),
    };
  }

  function normalizeAssignment_(value) {
    if (value && typeof value === "object") {
      const mode = normalizeMode_(value.mode || (value.camp ? "CAMP_TO_CAMP" : "OFFICE_TO_OFFICE"));
      return {
        mode,
        office: mode === "OFFICE_TO_OFFICE" ? text_(value.office) : "",
        camp: mode === "CAMP_TO_CAMP" ? text_(value.camp) : "",
      };
    }

    return { mode: "OFFICE_TO_OFFICE", office: text_(value), camp: "" };
  }

  function normalizeEntries_(entries) {
    const map = new Map();
    (entries || []).forEach(entry => {
      if (!Array.isArray(entry) || entry.length < 2) return;
      const key = text_(entry[0]);
      if (key) map.set(key, normalizeAssignment_(entry[1]));
    });
    return [...map.entries()];
  }

  function uniqueKeys_(keys) {
    return [...new Set((keys || []).map(text_).filter(Boolean))];
  }

  function legacyAssignments_() {
    return window.ReassignmentState?.assignments instanceof Map
      ? normalizeEntries_([...window.ReassignmentState.assignments.entries()])
      : [];
  }

  function legacySelectedKeys_() {
    return window.ReassignmentState?.selectedKeys instanceof Set
      ? uniqueKeys_([...window.ReassignmentState.selectedKeys])
      : [];
  }

  function initialState_() {
    const legacyEngine = window.ReassignmentEngine;
    const mode = normalizeMode_(legacyEngine?.state?.transferMode);
    return {
      transferMode: mode,
      destination: normalizeDestination_(mode, legacyEngine?.state?.destination?.value || ""),
      assignments: legacyAssignments_(),
      selectedKeys: legacySelectedKeys_(),
      undo: [],
      redo: [],
      updatedAt: new Date().toISOString(),
    };
  }

  function ensureScope_() {
    let state = platform.state.get(STATE_SCOPE);
    if (state) return state;

    const stored = platform.store.load(STORE_NAMESPACE, STORE_KEY, null);
    state = stored && typeof stored === "object"
      ? {
          ...initialState_(),
          ...stored,
          transferMode: normalizeMode_(stored.transferMode),
          destination: normalizeDestination_(normalizeMode_(stored.transferMode), stored.destination?.value),
          assignments: normalizeEntries_(stored.assignments),
          selectedKeys: uniqueKeys_(stored.selectedKeys),
          undo: Array.isArray(stored.undo) ? stored.undo : [],
          redo: Array.isArray(stored.redo) ? stored.redo : [],
        }
      : initialState_();

    platform.state.createScope(STATE_SCOPE, state);
    return platform.state.get(STATE_SCOPE);
  }

  function snapshot_(state) {
    return {
      transferMode: state.transferMode,
      destination: { ...state.destination },
      assignments: normalizeEntries_(state.assignments),
      selectedKeys: uniqueKeys_(state.selectedKeys),
    };
  }

  function mirrorToLegacy_(state) {
    if (window.ReassignmentState) {
      window.ReassignmentState.assignments = new Map(normalizeEntries_(state.assignments));
      window.ReassignmentState.selectedKeys = new Set(uniqueKeys_(state.selectedKeys));
      window.ReassignmentState.activeOffice = state.transferMode === "OFFICE_TO_OFFICE" ? state.destination.value : "";
      window.ReassignmentState.activeCamp = state.transferMode === "CAMP_TO_CAMP" ? state.destination.value : "";
    }

    if (window.ReassignmentEngine?.state) {
      window.ReassignmentEngine.state.transferMode = state.transferMode;
      window.ReassignmentEngine.state.destination = { ...state.destination };
    }

    if (typeof window.saveReassignmentState_ === "function") window.saveReassignmentState_();
  }

  function emit_(state, action) {
    platform.events.emit("assignment:changed", {
      scopeId: SCOPE,
      action,
      assigned: state.assignments.length,
      selected: state.selectedKeys.length,
      groups: AssignmentEngineV2.groups().length,
    });

    if (typeof window.ReassignmentEngine?.emit === "function") window.ReassignmentEngine.emit();
    else if (typeof window.renderReassignmentWorkspace_ === "function") window.renderReassignmentWorkspace_();
  }

  function liveSelectedKeys_(current) {
    const legacy = legacySelectedKeys_();
    const stored = uniqueKeys_(current?.selectedKeys);
    // While the legacy Step 1 renderer still owns its checkboxes, its Set is the
    // freshest source. This prevents transfer-mode and destination commands from
    // clearing a selection that was made immediately before the command.
    if (window.ReassignmentState?.selectedKeys instanceof Set) return legacy;
    return stored;
  }

  function commit_(next, action, options = {}) {
    const current = ensureScope_();
    const recordHistory = options.recordHistory !== false;
    const selectedFallback = liveSelectedKeys_(current);

    const state = {
      ...current,
      ...next,
      transferMode: normalizeMode_(next.transferMode ?? current.transferMode),
      assignments: normalizeEntries_(next.assignments ?? current.assignments),
      selectedKeys: Object.prototype.hasOwnProperty.call(next, "selectedKeys")
        ? uniqueKeys_(next.selectedKeys)
        : selectedFallback,
      updatedAt: new Date().toISOString(),
    };

    state.destination = normalizeDestination_(
      state.transferMode,
      next.destination?.value ?? current.destination?.value
    );

    if (recordHistory) {
      const currentForHistory = { ...current, selectedKeys: selectedFallback };
      state.undo = [...(current.undo || []), snapshot_(currentForHistory)].slice(-MAX_HISTORY);
      state.redo = [];
    }

    platform.state.set(STATE_SCOPE, state);
    platform.store.save(STORE_NAMESPACE, STORE_KEY, state);
    mirrorToLegacy_(state);
    emit_(state, action);
    return state;
  }

  function visibleUnassignedKeys_() {
    const cart = window.PersonnelState?.aoCart instanceof Map ? window.PersonnelState.aoCart : new Map();
    const assigned = AssignmentEngineV2.items();
    const entries = [...cart.entries()].filter(([key]) => !assigned.has(key));
    const visible = typeof window.filterUnassigned_ === "function" ? window.filterUnassigned_(entries) : entries;
    return visible.map(([key]) => key);
  }

  function assignmentForDestination_(state) {
    const value = text_(state.destination?.value);
    if (!value) return null;
    return state.transferMode === "CAMP_TO_CAMP"
      ? { mode: "CAMP_TO_CAMP", office: "", camp: value }
      : { mode: "OFFICE_TO_OFFICE", office: value, camp: "" };
  }

  const AssignmentEngineV2 = {
    version: "0.3.1",
    scopeId: SCOPE,

    get() { return ensureScope_(); },
    items() { return new Map(normalizeEntries_(this.get().assignments)); },
    selectedKeys() { return new Set(liveSelectedKeys_(this.get())); },
    directory() { return window.ReassignmentEngine?.getDirectory?.() || { camps: [], offices: [] }; },

    syncSelectionFromLegacy(options = {}) {
      const current = this.get();
      const selectedKeys = legacySelectedKeys_();
      const same = JSON.stringify(uniqueKeys_(current.selectedKeys)) === JSON.stringify(selectedKeys);
      if (same) {
        if (options.render && typeof window.ReassignmentEngine?.emit === "function") window.ReassignmentEngine.emit();
        return current;
      }
      return commit_({ selectedKeys }, "SYNC_SELECTION", { recordHistory: false });
    },

    setTransferMode(mode) {
      const value = normalizeMode_(mode);
      return commit_({ transferMode: value, destination: normalizeDestination_(value, "") }, "SET_TRANSFER_MODE");
    },

    setDestination(value) {
      const state = this.get();
      return commit_({ destination: normalizeDestination_(state.transferMode, value) }, "SET_DESTINATION");
    },

    assignKeys(keys) {
      const state = this.get();
      const assignment = assignmentForDestination_(state);
      if (!assignment) {
        alert(state.transferMode === "CAMP_TO_CAMP" ? "Choose a destination Camp first." : "Choose a destination Office first.");
        return state;
      }

      const cart = window.PersonnelState?.aoCart instanceof Map ? window.PersonnelState.aoCart : new Map();
      const map = this.items();
      uniqueKeys_(keys).forEach(key => {
        if (cart.has(key)) map.set(key, { ...assignment });
      });
      return commit_({ assignments: [...map.entries()], selectedKeys: [] }, "ASSIGN_KEYS");
    },

    assignSelected() { return this.assignKeys([...this.selectedKeys()]); },
    assignVisible() { return this.assignKeys(visibleUnassignedKeys_()); },

    remove(key) {
      const map = this.items();
      map.delete(text_(key));
      return commit_({ assignments: [...map.entries()] }, "REMOVE");
    },

    clear() { return commit_({ assignments: [], selectedKeys: [] }, "CLEAR"); },

    moveGroup(groupId, destination) {
      const [mode, oldDestination] = text_(groupId).split("|");
      const normalizedMode = normalizeMode_(mode);
      const map = this.items();
      map.forEach((assignment, key) => {
        const currentDestination = assignment.mode === "CAMP_TO_CAMP" ? assignment.camp : assignment.office;
        if (assignment.mode === normalizedMode && currentDestination === oldDestination) {
          map.set(key, normalizedMode === "CAMP_TO_CAMP"
            ? { mode: normalizedMode, office: "", camp: text_(destination) }
            : { mode: normalizedMode, office: text_(destination), camp: "" });
        }
      });
      return commit_({ assignments: [...map.entries()] }, "MOVE_GROUP");
    },

    groups() {
      const groups = new Map();
      this.items().forEach((assignment, key) => {
        const destination = assignment.mode === "CAMP_TO_CAMP" ? assignment.camp : assignment.office;
        const id = `${assignment.mode}|${destination}`;
        if (!groups.has(id)) groups.set(id, { id, mode: assignment.mode, destination, keys: [] });
        groups.get(id).keys.push(key);
      });
      return [...groups.values()];
    },

    undo() {
      const current = this.get();
      const previous = current.undo?.at(-1);
      if (!previous) return current;
      return commit_({
        ...previous,
        undo: current.undo.slice(0, -1),
        redo: [...(current.redo || []), snapshot_(current)].slice(-MAX_HISTORY),
      }, "UNDO", { recordHistory: false });
    },

    redo() {
      const current = this.get();
      const nextSnapshot = current.redo?.at(-1);
      if (!nextSnapshot) return current;
      return commit_({
        ...nextSnapshot,
        undo: [...(current.undo || []), snapshot_(current)].slice(-MAX_HISTORY),
        redo: current.redo.slice(0, -1),
      }, "REDO", { recordHistory: false });
    },

    syncFromLegacy() {
      const legacyEngine = window.ReassignmentEngine;
      const mode = normalizeMode_(legacyEngine?.state?.transferMode);
      return commit_({
        transferMode: mode,
        destination: normalizeDestination_(mode, legacyEngine?.state?.destination?.value),
        assignments: legacyAssignments_(),
        selectedKeys: legacySelectedKeys_(),
      }, "SYNC_FROM_LEGACY", { recordHistory: false });
    },

    report() {
      const state = this.get();
      const legacyCount = window.ReassignmentState?.assignments?.size || 0;
      const report = {
        version: this.version,
        scope: SCOPE,
        transferMode: state.transferMode,
        destination: state.destination?.value || "—",
        selected: this.selectedKeys().size,
        assigned: this.items().size,
        groups: this.groups().length,
        undo: state.undo?.length || 0,
        redo: state.redo?.length || 0,
        legacyCount,
        synchronized: this.items().size === legacyCount,
        updatedAt: state.updatedAt || "",
      };
      console.table(report);
      return report;
    },
  };

  platform.engines.replace("assignment", AssignmentEngineV2);

  platform.commands.register("ASSIGNMENT.SET_TRANSFER_MODE", command => AssignmentEngineV2.setTransferMode(command.value));
  platform.commands.register("ASSIGNMENT.SET_DESTINATION", command => AssignmentEngineV2.setDestination(command.value));
  platform.commands.register("ASSIGNMENT.ASSIGN_SELECTED", () => AssignmentEngineV2.assignSelected());
  platform.commands.register("ASSIGNMENT.ASSIGN_VISIBLE", () => AssignmentEngineV2.assignVisible());
  platform.commands.register("ASSIGNMENT.REMOVE", command => AssignmentEngineV2.remove(command.key));
  platform.commands.register("ASSIGNMENT.MOVE_GROUP", command => AssignmentEngineV2.moveGroup(command.groupId, command.destination || command.value));
  platform.commands.register("ASSIGNMENT.CLEAR", () => AssignmentEngineV2.clear());
  platform.commands.register("ASSIGNMENT.UNDO", () => AssignmentEngineV2.undo());
  platform.commands.register("ASSIGNMENT.REDO", () => AssignmentEngineV2.redo());
  platform.commands.register("ASSIGNMENT.SYNC_SELECTION", () => AssignmentEngineV2.syncSelectionFromLegacy({ render: true }));

  ensureScope_();
  mirrorToLegacy_(AssignmentEngineV2.get());

  if (window.ReassignmentEngine?.dispatch) {
    const legacyDispatch = window.ReassignmentEngine.dispatch.bind(window.ReassignmentEngine);
    window.ReassignmentEngine.dispatch = function (command) {
      const type = text_(command?.type).toUpperCase();
      if (type === "SET_TRANSFER_MODE") return AssignmentEngineV2.setTransferMode(command.value);
      if (type === "SET_DESTINATION") return AssignmentEngineV2.setDestination(command.value);
      if (type === "ASSIGN_SELECTED") return AssignmentEngineV2.assignSelected();
      if (type === "ASSIGN_VISIBLE") return AssignmentEngineV2.assignVisible();
      if (type === "REMOVE_ASSIGNMENT") return AssignmentEngineV2.remove(command.key);
      if (type === "UNDO") return AssignmentEngineV2.undo();
      if (type === "REDO") return AssignmentEngineV2.redo();
      return legacyDispatch(command);
    };
  }

  // The legacy Step 1 checkbox handler updates ReassignmentState after the
  // checkbox event. Synchronize on the next task, then rerender Step 2 so its
  // Assign Selected button immediately reflects the current selection.
  document.addEventListener("change", event => {
    const checkbox = event.target;
    if (!(checkbox instanceof HTMLInputElement) || checkbox.type !== "checkbox") return;
    if (!checkbox.closest(".reassignment-workspace, .reassignment-source-panel, .reassignment-layout")) return;
    setTimeout(() => AssignmentEngineV2.syncSelectionFromLegacy({ render: true }), 0);
  }, true);

  window.$PF.assignment = AssignmentEngineV2;
  console.info("AssignmentEngine v0.3.1 owns reassignment assignments in Developer Mode. Run $PF.assignment.report().");
})();
</script>
